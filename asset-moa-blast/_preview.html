<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Blast preview</title>
<style>
  html,body{margin:0;background:#1b1030;height:100%}
  #wrap{display:flex;gap:0;align-items:flex-start;justify-content:flex-start}
  iframe{border:0;display:block;background:#7d63e6}
</style>
</head>
<body>
<div id="wrap"><iframe id="f"></iframe></div>
<script>
  var q = new URLSearchParams(location.search);
  var w = Number(q.get('w') || 390), h = Number(q.get('h') || 844);
  var f = document.getElementById('f');
  f.width = w; f.height = h;
  f.src = './index.html?v=' + (q.get('v') || '56') + '&preview=1';
  window.__frame = f;
</script>
</body>
</html>
