<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#d9f4ef"><title>자산 모아 마을 2 | 보석을 모으는 분개 여행</title><meta name="description" content="모아와 네 개의 학습 집을 탐험하며 분개와 계산을 연습해요."><link rel="stylesheet" href="style.css"></head><body>
