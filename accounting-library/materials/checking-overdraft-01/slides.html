<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>당좌예금과 당좌차월의 회계 처리</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Pretendard & Cute Rounded Font (Jua) -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #3b2f2f;
      --red-t: #dc2626;
    }
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at 18% 18%, #fff1f5 0%, #f0f9ff 55%, #fefce8 100%);
      color: #33272a;
      margin: 0;
      padding: 0;
      overflow: hidden;
      user-select: none;
    }
    .font-cute {
      font-family: 'Jua', 'Pretendard', sans-serif;
      letter-spacing: 0.01em;
    }
    /* Cute Thick Sketch Border like Chiikawa */
    .chii-card {
      border: 3px solid #3b2f2f;
      box-shadow: 0 5px 0 #3b2f2f;
      border-radius: 1.25rem;
      background-color: #ffffff;
    }
    .chii-card-sm {
      border: 2.5px solid #3b2f2f;
      box-shadow: 0 3px 0 #3b2f2f;
      border-radius: 0.9rem;
    }
    .chii-btn {
      border: 2.5px solid #3b2f2f;
      box-shadow: 0 3px 0 #3b2f2f;
      transition: transform 0.1s ease, box-shadow 0.1s ease, background-color 0.15s ease;
    }
    .chii-btn:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #3b2f2f;
    }
    /* Textbook Red T-Account Styling (No 차변/대변 labels inside) */
    .red-t-header {
      border-bottom: 3.5px solid #dc2626;
    }
    .red-t-divider {
      border-right: 3.5px solid #dc2626;
    }
    /* 16:9 Stage Container - Strictly fitted inside viewport without clipping */
    .stage-16-9 {
      width: min(96vw, calc(94vh * 16 / 9));
      height: min(94vh, calc(96vw * 9 / 16));
    }
    @keyframes softPop {
      from { opacity: 0; transform: scale(0.992); }
      to { opacity: 1; transform: scale(1); }
    }
    .slide-fade {
      animation: softPop 0.18s ease-out forwards;
    }
  </style>
</head>
<body class="w-screen h-screen flex items-center justify-center overflow-hidden p-1">

  <!-- 16:9 Fixed Ratio Presentation Canvas -->
  <div class="stage-16-9 chii-card bg-white flex flex-col justify-between overflow-hidden relative">

    <!-- Top Compact Header (Height ~10%) -->
    <header class="h-[10%] min-h-[44px] bg-[#fff8fa] border-b-[3px] border-[#3b2f2f] px-4 flex items-center justify-between shrink-0">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-full bg-sky-200 border-2 border-[#3b2f2f] flex items-center justify-center shadow-sm shrink-0">
          <svg class="w-6 h-6" viewBox="0 0 60 60">
            <polygon points="10,22 16,6 26,17" fill="#7dd3fc" stroke="#3b2f2f" stroke-width="3.5" stroke-linejoin="round"/>
            <polygon points="50,22 44,6 34,17" fill="#7dd3fc" stroke="#3b2f2f" stroke-width="3.5" stroke-linejoin="round"/>
            <ellipse cx="30" cy="35" rx="22" ry="18" fill="#fff" stroke="#3b2f2f" stroke-width="3.5"/>
            <path d="M10 27 Q20 15 30 25 Q40 15 50 27 Q44 17 30 17 Q16 17 10 27 Z" fill="#7dd3fc"/>
            <circle cx="22" cy="32" r="2.8" fill="#3b2f2f"/>
            <circle cx="38" cy="32" r="2.8" fill="#3b2f2f"/>
            <path d="M26 37 Q30 40 34 37" fill="none" stroke="#3b2f2f" stroke-width="2.5" stroke-linecap="round"/>
          </svg>
        </div>
        <span class="bg-[#38bdf8] text-[#3b2f2f] text-[11px] font-extrabold px-2.5 py-0.5 rounded-full border-2 border-[#3b2f2f] shrink-0">회계원리 · 88~90쪽</span>
        <h1 class="font-cute text-base lg:text-lg text-[#3b2f2f] tracking-tight truncate">당좌예금과 당좌차월의 회계 처리</h1>
      </div>

      <!-- Section Quick Tabs -->
      <nav class="hidden xl:flex items-center gap-1 text-xs">
        <button onclick="goToSlide(0)" class="sec-pill px-2.5 py-0.5 rounded-full font-bold transition" data-sec="0">1. 도입</button>
        <button onclick="goToSlide(2)" class="sec-pill px-2.5 py-0.5 rounded-full font-bold transition" data-sec="1">2. 당좌예금 원장</button>
        <button onclick="goToSlide(4)" class="sec-pill px-2.5 py-0.5 rounded-full font-bold transition" data-sec="2">3. 예제 06</button>
        <button onclick="goToSlide(6)" class="sec-pill px-2.5 py-0.5 rounded-full font-bold transition" data-sec="3">4. 당좌차월·예제 07</button>
        <button onclick="goToSlide(10)" class="sec-pill px-2.5 py-0.5 rounded-full font-bold transition" data-sec="4">5. 종합 연습(7문항)</button>
        <button onclick="goToSlide(12)" class="sec-pill px-2.5 py-0.5 rounded-full font-bold transition" data-sec="5">6. 약식 T계정</button>
        <button onclick="goToSlide(13)" class="sec-pill px-2.5 py-0.5 rounded-full font-bold transition" data-sec="6">7. 요약</button>
      </nav>

      <!-- Page Counter -->
      <div class="flex items-center gap-1.5 shrink-0">
        <span id="section-badge" class="bg-[#fef08a] text-[#3b2f2f] text-[11px] font-extrabold px-2.5 py-0.5 rounded-full border-2 border-[#3b2f2f]">1. 도입</span>
        <span id="slide-counter" class="font-mono text-[11px] font-extrabold bg-white text-[#3b2f2f] px-2.5 py-0.5 rounded-full border-2 border-[#3b2f2f]">1 / 14</span>
      </div>
    </header>

    <!-- Slide Body (Height 80%, Strictly Fitted) -->
    <main id="slide-content" class="flex-1 min-h-0 w-full px-5 py-2.5 flex flex-col justify-between gap-2 overflow-hidden slide-fade"></main>

    <!-- Bottom Navigation Bar (Height ~10%) -->
    <footer class="h-[10%] min-h-[42px] bg-[#f8fafc] border-t-[3px] border-[#3b2f2f] px-5 flex items-center justify-between shrink-0">
      <button id="prev-btn" onclick="prevSlide()" class="chii-btn flex items-center gap-1.5 px-3.5 py-1 rounded-xl font-extrabold text-xs bg-white text-[#3b2f2f] hover:bg-slate-100 disabled:opacity-40 disabled:pointer-events-none">
        ◀ 이전 슬라이드
      </button>

      <!-- Progress Dots -->
      <div id="dots-container" class="flex items-center gap-1.5"></div>

      <button id="next-btn" onclick="nextSlide()" class="chii-btn flex items-center gap-1.5 px-4 py-1 rounded-xl font-extrabold text-xs bg-[#ffd166] text-[#3b2f2f] hover:bg-[#ffca4b]">
        다음 슬라이드 ▶
      </button>
    </footer>

  </div>

  <!-- Application Script -->
  <script>
    let currentSlide = 0;
    const totalSlides = 14;

    // Interactive State Store (All support two-way toggle open/close)
    const appState = {
      // Slide 4: 차변/대변 미니 퀴즈
      drCrQuiz: { q1: null, q2: null, q3: null, q4: null },
      // Slide 5: 예제 06 (추가 연습 예제)
      ex06Step: 1,
      ex06Reveal: { s1: false, s2: false, s3: false },
      // Slide 8: 당좌차월 기초 분개 빈칸
      overdraftIntro: { dr: false, cr1: false, cr2: false },
      // Slide 9: 예제 07 (추가 연습 예제)
      ex07Step: 1,
      ex07Reveal: { s1: false, s2: false, s3: false },
      // Slide 11: 종합 연습 기본 거래 (문제 1~4)
      compBasicIdx: 0,
      compBasicReveal: { p1: false, p2: false, p3: false, p4: false },
      // Slide 12: 종합 연습 연속 거래 (문제 5~7)
      compContReveal: { p5: false, p6: false, p7: false },
      // Slide 13: 빨간색 약식 T계정 전기
      tAccountReveal: {
        chkDr1: false, chkDr2: false, chkCr1: false, chkBal: false,
        ovDr1: false, ovCr1: false
      }
    };

    const slideMeta = [
      { section: "1. 도입", secIdx: 0 },
      { section: "1. 도입", secIdx: 0 },
      { section: "2. 당좌예금 원장", secIdx: 1 },
      { section: "2. 당좌예금 원장", secIdx: 1 },
      { section: "3. 예제 06", secIdx: 2 },
      { section: "3. 예제 06", secIdx: 2 },
      { section: "4. 당좌차월·예제 07", secIdx: 3 },
      { section: "4. 당좌차월·예제 07", secIdx: 3 },
      { section: "4. 당좌차월·예제 07", secIdx: 3 },
      { section: "4. 당좌차월·예제 07", secIdx: 3 },
      { section: "5. 종합 연습(7문항)", secIdx: 4 },
      { section: "5. 종합 연습(7문항)", secIdx: 4 },
      { section: "6. 약식 T계정", secIdx: 5 },
      { section: "7. 요약", secIdx: 6 }
    ];

    function fmtNum(n) {
      return n.toLocaleString('ko-KR');
    }

    // Chiikawa-inspired SVG Mascots
    function svgChii(mood = 'normal', size = 'w-12 h-12') {
      const eyes = mood === 'cry'
        ? `<circle cx="22" cy="32" r="3" fill="#3b2f2f"/><circle cx="38" cy="32" r="3" fill="#3b2f2f"/><path d="M18 36 Q20 42 22 36" fill="#60a5fa"/><path d="M38 36 Q40 42 42 36" fill="#60a5fa"/>`
        : mood === 'sparkle'
        ? `<circle cx="22" cy="31" r="3.5" fill="#3b2f2f"/><circle cx="21" cy="30" r="1.2" fill="#fff"/><circle cx="38" cy="31" r="3.5" fill="#3b2f2f"/><circle cx="37" cy="30" r="1.2" fill="#fff"/>`
        : `<circle cx="22" cy="31" r="2.8" fill="#3b2f2f"/><circle cx="38" cy="31" r="2.8" fill="#3b2f2f"/>`;
      const mouth = mood === 'cry'
        ? `<path d="M26 40 Q30 36 34 40" fill="none" stroke="#3b2f2f" stroke-width="2.5" stroke-linecap="round"/>`
        : `<path d="M26 36 Q28 39 30 36 Q32 39 34 36" fill="none" stroke="#3b2f2f" stroke-width="2.3" stroke-linecap="round"/>`;
      return `
        <svg class="${size} shrink-0" viewBox="0 0 60 60">
          <circle cx="15" cy="14" r="8.5" fill="#ffffff" stroke="#3b2f2f" stroke-width="3.2"/>
          <circle cx="15" cy="14" r="4" fill="#fbcfe8"/>
          <circle cx="45" cy="14" r="8.5" fill="#ffffff" stroke="#3b2f2f" stroke-width="3.2"/>
          <circle cx="45" cy="14" r="4" fill="#fbcfe8"/>
          <ellipse cx="30" cy="34" rx="23" ry="19" fill="#ffffff" stroke="#3b2f2f" stroke-width="3.2"/>
          <ellipse cx="17" cy="36" rx="4" ry="2.2" fill="#fda4af"/>
          <ellipse cx="43" cy="36" rx="4" ry="2.2" fill="#fda4af"/>
          ${eyes}
          ${mouth}
        </svg>
      `;
    }

    function svgHachi(size = 'w-12 h-12') {
      return `
        <svg class="${size} shrink-0" viewBox="0 0 60 60">
          <polygon points="10,22 16,6 26,17" fill="#7dd3fc" stroke="#3b2f2f" stroke-width="3.2" stroke-linejoin="round"/>
          <polygon points="50,22 44,6 34,17" fill="#7dd3fc" stroke="#3b2f2f" stroke-width="3.2" stroke-linejoin="round"/>
          <ellipse cx="30" cy="35" rx="23" ry="18.5" fill="#ffffff" stroke="#3b2f2f" stroke-width="3.2"/>
          <path d="M10 27 Q20 15 30 25 Q40 15 50 27 Q44 17 30 17 Q16 17 10 27 Z" fill="#7dd3fc"/>
          <ellipse cx="17" cy="37" rx="4" ry="2.2" fill="#fda4af"/>
          <ellipse cx="43" cy="37" rx="4" ry="2.2" fill="#fda4af"/>
          <circle cx="22" cy="32" r="2.8" fill="#3b2f2f"/>
          <circle cx="38" cy="32" r="2.8" fill="#3b2f2f"/>
          <path d="M26 37 Q28 40 30 37 Q32 40 34 37" fill="none" stroke="#3b2f2f" stroke-width="2.3" stroke-linecap="round"/>
        </svg>
      `;
    }

    function svgUsa(size = 'w-12 h-12') {
      return `
        <svg class="${size} shrink-0" viewBox="0 0 60 60">
          <ellipse cx="21" cy="13" rx="5.5" ry="11" fill="#fef08a" stroke="#3b2f2f" stroke-width="3.2"/>
          <ellipse cx="39" cy="13" rx="5.5" ry="11" fill="#fef08a" stroke="#3b2f2f" stroke-width="3.2"/>
          <ellipse cx="30" cy="37" rx="22" ry="17.5" fill="#fef9c3" stroke="#3b2f2f" stroke-width="3.2"/>
          <ellipse cx="17" cy="39" rx="4" ry="2.2" fill="#fda4af"/>
          <ellipse cx="43" cy="39" rx="4" ry="2.2" fill="#fda4af"/>
          <circle cx="22" cy="34" r="2.8" fill="#3b2f2f"/>
          <circle cx="38" cy="34" r="2.8" fill="#3b2f2f"/>
          <path d="M27 39 Q30 43 33 39" fill="#fda4af" stroke="#3b2f2f" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
      `;
    }

    function renderSlide() {
      const main = document.getElementById('slide-content');
      main.classList.remove('slide-fade');
      void main.offsetWidth;
      main.classList.add('slide-fade');

      const meta = slideMeta[currentSlide];
      document.getElementById('section-badge').textContent = meta.section;
      document.getElementById('slide-counter').textContent = `${currentSlide + 1} / ${totalSlides}`;

      document.querySelectorAll('.sec-pill').forEach(btn => {
        const sec = parseInt(btn.getAttribute('data-sec'), 10);
        if (sec === meta.secIdx) {
          btn.className = "sec-pill px-2.5 py-0.5 rounded-full font-extrabold bg-[#38bdf8] text-[#3b2f2f] border-2 border-[#3b2f2f]";
        } else {
          btn.className = "sec-pill px-2.5 py-0.5 rounded-full font-bold text-slate-500 hover:bg-sky-100";
        }
      });

      document.getElementById('prev-btn').disabled = (currentSlide === 0);
      const nextBtn = document.getElementById('next-btn');
      nextBtn.innerHTML = currentSlide === totalSlides - 1 ? `처음으로 ↺` : `다음 슬라이드 ▶`;

      renderDots();
      main.innerHTML = getSlideHTML(currentSlide);
    }

    function renderDots() {
      const container = document.getElementById('dots-container');
      let html = '';
      for (let i = 0; i < totalSlides; i++) {
        const active = (i === currentSlide);
        html += `<button onclick="goToSlide(${i})" class="h-2.5 rounded-full border-2 border-[#3b2f2f] transition-all ${active ? 'w-6 bg-[#38bdf8]' : 'w-2.5 bg-white hover:bg-sky-100'}"></button>`;
      }
      container.innerHTML = html;
    }

    function nextSlide() {
      currentSlide = (currentSlide < totalSlides - 1) ? currentSlide + 1 : 0;
      renderSlide();
    }
    function prevSlide() {
      if (currentSlide > 0) {
        currentSlide--;
        renderSlide();
      }
    }
    function goToSlide(idx) {
      currentSlide = idx;
      renderSlide();
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') nextSlide();
      if (e.key === 'ArrowLeft') prevSlide();
    });

    function getSlideHTML(idx) {
      switch (idx) {
        case 0: return renderSlide1();
        case 1: return renderSlide2();
        case 2: return renderSlide3();
        case 3: return renderSlide4();
        case 4: return renderSlide5();
        case 5: return renderSlide6();
        case 6: return renderSlide7();
        case 7: return renderSlide8();
        case 8: return renderSlide9();
        case 9: return renderSlide10();
        case 10: return renderSlide11();
        case 11: return renderSlide12();
        case 12: return renderSlide13();
        case 13: return renderSlide14();
        default: return '';
      }
    }

    // =========================================================================
    // SLIDE 1: [도입] 당좌예금이란? (카페 · 은행 · 거래처 3자 수평 그림)
    // =========================================================================
    function renderSlide1() {
      return `
        <div class="flex items-center justify-between bg-[#e0f2fe] chii-card-sm px-4 py-2 shrink-0">
          <div class="flex items-center gap-3">
            ${svgHachi('w-10 h-10')}
            <div>
              <span class="text-xs font-extrabold text-sky-800">1. 도입 · 당좌예금이란 무엇일까?</span>
              <h2 class="font-cute text-lg lg:text-xl text-[#3b2f2f]">거액의 원두 대금, 현금 다발 대신 「수표」로 지급한다면?</h2>
            </div>
          </div>
          <span class="bg-white px-3 py-1 rounded-full text-xs font-extrabold border-2 border-[#3b2f2f]">교과서 88쪽</span>
        </div>

        <!-- 3-Column Horizontal Diagram: 카페 -> 거래처 -> 은행 -->
        <div class="grid grid-cols-3 gap-4 flex-1 min-h-0 items-stretch">
          <!-- Step 1: 카페 (당점) -->
          <div class="chii-card-sm bg-[#fff8fa] p-3.5 flex flex-col justify-between text-center">
            <div class="flex items-center justify-between">
              <span class="bg-pink-500 text-white text-[11px] font-extrabold px-2.5 py-0.5 rounded-full border border-[#3b2f2f]">① 우리 카페 (발행인)</span>
              <span class="text-xl">☕</span>
            </div>
            <div class="my-auto flex flex-col items-center gap-1.5">
              ${svgChii('sparkle', 'w-14 h-14')}
              <h3 class="font-cute text-base lg:text-lg text-[#3b2f2f]">당좌예금 계좌 개설 & 수표 발행</h3>
              <p class="text-xs font-bold text-slate-600 leading-snug">
                은행에 <strong>당좌예금</strong>을 넣어 두고,<br/>원두 대금을 줄 때 <strong>당좌수표를 발행</strong>해요!
              </p>
            </div>
            <div class="bg-white rounded-xl p-2 border-2 border-[#3b2f2f] text-xs font-extrabold text-pink-700">
              수표 발행 시 ➔ (대변) 당좌예금 감소
            </div>
          </div>

          <!-- Step 2: 거래처 (동점) -->
          <div class="chii-card-sm bg-[#fefce8] p-3.5 flex flex-col justify-between text-center">
            <div class="flex items-center justify-between">
              <span class="bg-amber-500 text-[#3b2f2f] text-[11px] font-extrabold px-2.5 py-0.5 rounded-full border border-[#3b2f2f]">② 원두 거래처 (수취인)</span>
              <span class="text-xl">🚚</span>
            </div>
            <div class="my-auto flex flex-col items-center gap-1.5">
              ${svgUsa('w-14 h-14')}
              <h3 class="font-cute text-base lg:text-lg text-[#3b2f2f]">수표를 받아 은행에 제시</h3>
              <p class="text-xs font-bold text-slate-600 leading-snug">
                카페가 발행한 수표를 받아서<br/>은행에 가져가면 현금으로 바꿔요!
              </p>
            </div>
            <div class="bg-white rounded-xl p-2 border-2 border-[#3b2f2f] text-xs font-extrabold text-amber-800">
              거래처 입장: 남이 발행한 수표 = 현금!
            </div>
          </div>

          <!-- Step 3: 은행 (지급인) -->
          <div class="chii-card-sm bg-[#ecfdf5] p-3.5 flex flex-col justify-between text-center">
            <div class="flex items-center justify-between">
              <span class="bg-emerald-600 text-white text-[11px] font-extrabold px-2.5 py-0.5 rounded-full border border-[#3b2f2f]">③ 은행 (당좌예금 관리)</span>
              <span class="text-xl">🏦</span>
            </div>
            <div class="my-auto flex flex-col items-center gap-1.5">
              ${svgHachi('w-14 h-14')}
              <h3 class="font-cute text-base lg:text-lg text-[#3b2f2f]">카페의 당좌예금에서 지급</h3>
              <p class="text-xs font-bold text-slate-600 leading-snug">
                수표를 확인하고 카페의 <strong>당좌예금 잔액</strong>에서 돈을 인출해 거래처에 지급해요!
              </p>
            </div>
            <div class="bg-white rounded-xl p-2 border-2 border-[#3b2f2f] text-xs font-extrabold text-emerald-800">
              당좌예금 = 수표 발행을 위한 예금(자산)
            </div>
          </div>
        </div>

                    <button onclick="toggleTAcc('chkBal')" class="w-full chii-btn bg-amber-50 hover:bg-amber-100 py-2 rounded-lg text-xs font-extrabold text-amber-900">
                      👆 최종 당좌예금 잔액 확인
                    </button>
                  `}
                </div>

                <div class="text-[11px] font-extrabold text-slate-400 text-right pt-1">
                  ${t.chkCr1 && t.chkBal ? '차변 450,000 - 대변 200,000 = 잔액 250,000' : ''}
                </div>
              </div>
            </div>
          </div>

          <!-- Right 5 Cols: 당좌차월 (Fewer entries -> Compact space) -->
          <div class="col-span-5 chii-card-sm bg-white p-3.5 flex flex-col justify-between">
            <!-- Account Title Centered on Top, Red T-Line, NO 차변/대변 labels inside -->
            <div class="red-t-header text-center pb-1.5">
              <span class="font-cute text-xl text-[#3b2f2f]">당 좌 차 월</span>
            </div>

            <div class="grid grid-cols-2 flex-1 items-stretch text-xs">
              <!-- Left Side of Red T -->
              <div class="red-t-divider p-3 flex flex-col justify-between">
                <div>
                  ${t.ovDr1 ? `
                    <div onclick="toggleTAcc('ovDr1')" class="bg-emerald-50 p-2.5 rounded-lg border-2 border-[#3b2f2f] cursor-pointer flex justify-between font-extrabold text-emerald-900">
                      <span>5/10 현금 🙈</span><span class="font-mono">300,000</span>
                    </div>
                  ` : `
                    <button onclick="toggleTAcc('ovDr1')" class="w-full chii-btn bg-slate-50 hover:bg-emerald-50 py-3 rounded-lg text-xs font-extrabold text-slate-500">
                      👆 5/10 차월 상환 전기
                    </button>
                  `}
                </div>

                <div class="bg-slate-100 rounded-lg p-2 text-center text-[11px] font-extrabold text-slate-600">
                  ${t.ovDr1 && t.ovCr1 ? '🎉 당좌차월 잔액: 0원' : '전기 후 잔액을 확인하세요'}
                </div>
              </div>

              <!-- Right Side of Red T -->
              <div class="p-3 flex flex-col justify-between">
                <div>
                  ${t.ovCr1 ? `
                    <div onclick="toggleTAcc('ovCr1')" class="bg-rose-50 p-2.5 rounded-lg border-2 border-[#3b2f2f] cursor-pointer flex justify-between font-extrabold text-rose-900">
                      <span>5/3 상품 🙈</span><span class="font-mono">300,000</span>
                    </div>
                  ` : `
                    <button onclick="toggleTAcc('ovCr1')" class="w-full chii-btn bg-slate-50 hover:bg-rose-50 py-3 rounded-lg text-xs font-extrabold text-slate-500">
                      👆 5/3 차월 발생 전기
                    </button>
                  `}
                </div>

                <div class="text-[11px] font-bold text-slate-400 text-center">
                  ${t.ovDr1 && t.ovCr1 ? '300,000 = 300,000 (완납)' : ''}
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
    }
