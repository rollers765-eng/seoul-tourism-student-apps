<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>현금과 현금과부족의 회계 처리</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Pretendard & Cute Rounded Font (Jua / Gamja Flower / Gaegu style fallback) -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #3b2f2f;
      --pink-pastel: #ffe4ec;
      --blue-pastel: #e0f2fe;
      --yellow-pastel: #fef9c3;
      --mint-pastel: #d1fae5;
    }
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at 20% 20%, #fff1f5 0%, #f0f7ff 55%, #fefce8 100%);
      color: #33272a;
      margin: 0;
      padding: 0;
      overflow: hidden;
      user-select: none;
    }
    .font-cute {
      font-family: 'Jua', 'Pretendard', sans-serif;
      letter-spacing: 0.01em;
    }
    /* Cute Thick Sketch Border like Chiikawa */
    .chii-card {
      border: 3px solid #3b2f2f;
      box-shadow: 0 5px 0 #3b2f2f;
      border-radius: 1.25rem;
      background-color: #ffffff;
    }
    .chii-card-sm {
      border: 2.5px solid #3b2f2f;
      box-shadow: 0 3px 0 #3b2f2f;
      border-radius: 0.9rem;
    }
    .chii-btn {
      border: 2.5px solid #3b2f2f;
      box-shadow: 0 3px 0 #3b2f2f;
      transition: transform 0.1s ease, box-shadow 0.1s ease, background-color 0.15s ease;
    }
    .chii-btn:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #3b2f2f;
    }
    /* T-Account Custom Styling */
    .t-header {
      border-bottom: 3.5px solid #3b2f2f;
    }
    .t-divider {
      border-right: 3.5px solid #3b2f2f;
    }
    /* 16:9 Stage Container - Strictly fitted inside viewport without clipping */
    .stage-16-9 {
      width: min(96vw, calc(94vh * 16 / 9));
      height: min(94vh, calc(96vw * 9 / 16));
    }
    /* Subtle Fade Only (No meaningless horizontal bouncing) */
    @keyframes softPop {
      from { opacity: 0; transform: scale(0.99); }
      to { opacity: 1; transform: scale(1); }
    }
    .slide-fade {
      animation: softPop 0.2s ease-out forwards;
    }
  </style>
</head>
<body class="w-screen h-screen flex items-center justify-center overflow-hidden p-1">

  <!-- 16:9 Fixed Ratio Presentation Canvas -->
  <div class="stage-16-9 chii-card bg-white flex flex-col justify-between overflow-hidden relative">

    <!-- Top Compact Header (Height ~10%) -->
    <header class="h-[10%] min-h-[44px] bg-[#fff8fa] border-b-[3px] border-[#3b2f2f] px-4 flex items-center justify-between shrink-0">
      <div class="flex items-center gap-2.5">
        <!-- Cute Mascot Mini Icon -->
        <div class="w-8 h-8 rounded-full bg-pink-200 border-2 border-[#3b2f2f] flex items-center justify-center shadow-sm shrink-0">
          <svg class="w-6 h-6" viewBox="0 0 60 60">
            <circle cx="16" cy="14" r="8" fill="#fff" stroke="#3b2f2f" stroke-width="3.5"/>
            <circle cx="44" cy="14" r="8" fill="#fff" stroke="#3b2f2f" stroke-width="3.5"/>
            <ellipse cx="30" cy="34" rx="22" ry="19" fill="#fff" stroke="#3b2f2f" stroke-width="3.5"/>
            <ellipse cx="19" cy="36" rx="3.5" ry="2" fill="#fda4af"/>
            <ellipse cx="41" cy="36" rx="3.5" ry="2" fill="#fda4af"/>
            <circle cx="23" cy="31" r="2.5" fill="#3b2f2f"/>
            <circle cx="37" cy="31" r="2.5" fill="#3b2f2f"/>
            <path d="M27 36 Q30 39 33 36" fill="none" stroke="#3b2f2f" stroke-width="2.5" stroke-linecap="round"/>
          </svg>
        </div>
        <span class="bg-[#ff8fab] text-white text-[11px] font-extrabold px-2.5 py-0.5 rounded-full border-2 border-[#3b2f2f] shrink-0">회계원리</span>
        <h1 class="font-cute text-base lg:text-lg text-[#3b2f2f] tracking-tight truncate">현금과 현금과부족의 회계 처리</h1>
      </div>

      <!-- Section Quick Tabs -->
      <nav class="hidden xl:flex items-center gap-1 text-xs">
        <button onclick="goToSlide(0)" class="sec-pill px-2.5 py-0.5 rounded-full font-bold transition" data-sec="0">1. 도입</button>
        <button onclick="goToSlide(2)" class="sec-pill px-2.5 py-0.5 rounded-full font-bold transition" data-sec="1">2. 현금의 범위</button>
        <button onclick="goToSlide(4)" class="sec-pill px-2.5 py-0.5 rounded-full font-bold transition" data-sec="2">3. 수표 처리</button>
        <button onclick="goToSlide(9)" class="sec-pill px-2.5 py-0.5 rounded-full font-bold transition" data-sec="3">4. 현금과부족</button>
        <button onclick="goToSlide(14)" class="sec-pill px-2.5 py-0.5 rounded-full font-bold transition" data-sec="4">5. 반복 연습</button>
        <button onclick="goToSlide(15)" class="sec-pill px-2.5 py-0.5 rounded-full font-bold transition" data-sec="5">6. 요약</button>
      </nav>

      <!-- Page Counter -->
      <div class="flex items-center gap-1.5 shrink-0">
        <span id="section-badge" class="bg-[#fef08a] text-[#3b2f2f] text-[11px] font-extrabold px-2.5 py-0.5 rounded-full border-2 border-[#3b2f2f]">1. 도입</span>
        <span id="slide-counter" class="font-mono text-[11px] font-extrabold bg-white text-[#3b2f2f] px-2.5 py-0.5 rounded-full border-2 border-[#3b2f2f]">1 / 16</span>
      </div>
    </header>

    <!-- Slide Body (Height 80%, Strictly Fitted, Side-by-Side Alignment) -->
    <main id="slide-content" class="flex-1 min-h-0 w-full px-5 py-2.5 flex flex-col justify-between gap-2 overflow-hidden slide-fade"></main>

    <!-- Bottom Navigation Bar (Height ~10%) -->
    <footer class="h-[10%] min-h-[42px] bg-[#f8fafc] border-t-[3px] border-[#3b2f2f] px-5 flex items-center justify-between shrink-0">
      <button id="prev-btn" onclick="prevSlide()" class="chii-btn flex items-center gap-1.5 px-3.5 py-1 rounded-xl font-extrabold text-xs bg-white text-[#3b2f2f] hover:bg-slate-100 disabled:opacity-40 disabled:pointer-events-none">
        ◀ 이전 슬라이드
      </button>

      <!-- Progress Dots -->
      <div id="dots-container" class="flex items-center gap-1.5"></div>

      <button id="next-btn" onclick="nextSlide()" class="chii-btn flex items-center gap-1.5 px-4 py-1 rounded-xl font-extrabold text-xs bg-[#ffd166] text-[#3b2f2f] hover:bg-[#ffca4b]">
        다음 슬라이드 ▶
      </button>
    </footer>

  </div>

  <!-- Application Script -->
  <script>
    let currentSlide = 0;
    const totalSlides = 16;

    // Interactive State Store
    const appState = {
      cashQuiz: { q1: null, q2: null, q3: null, q4: null },
      checkEx1: { revealed: false, choice: null },
      checkEx2: { revealed: false, choice: null },
      checkEx3: { dr1: false, dr2: false, cr1: false },
      caseAStep: 1,
      caseABlanks: { s1: false, s2: false, s3: false },
      caseBStep: 1,
      caseBBlanks: { s1: false, s2: false, s3: false },
      repQuiz: {
        p1: { revealed: false, side: null },
        p2: { revealed: false, side: null },
        p3: { revealed: false, side: null }
      }
    };

    const slideMeta = [
      { section: "1. 도입", secIdx: 0 },
      { section: "1. 도입", secIdx: 0 },
      { section: "2. 현금의 범위", secIdx: 1 },
      { section: "2. 현금의 범위", secIdx: 1 },
      { section: "3. 수표 처리", secIdx: 2 },
      { section: "3. 수표 처리", secIdx: 2 },
      { section: "3. 수표 처리", secIdx: 2 },
      { section: "3. 수표 처리", secIdx: 2 },
      { section: "3. 수표 처리", secIdx: 2 },
      { section: "4. 현금과부족", secIdx: 3 },
      { section: "4. 현금과부족", secIdx: 3 },
      { section: "4. 현금과부족", secIdx: 3 },
      { section: "4. 현금과부족", secIdx: 3 },
      { section: "4. 현금과부족", secIdx: 3 },
      { section: "5. 반복 연습", secIdx: 4 },
      { section: "6. 요약", secIdx: 5 }
    ];

    function fmtNum(n) {
      return n.toLocaleString('ko-KR');
    }

    // Chiikawa-inspired SVG Characters (White Hamster "치이", Blue Cat-friend "하치", Yellow Bunny "우사")
    function svgChii(mood = 'normal', size = 'w-16 h-16') {
      const eyes = mood === 'cry'
        ? `<circle cx="22" cy="32" r="3" fill="#3b2f2f"/><circle cx="38" cy="32" r="3" fill="#3b2f2f"/><path d="M18 36 Q20 42 22 36" fill="#60a5fa"/><path d="M38 36 Q40 42 42 36" fill="#60a5fa"/>`
        : mood === 'sparkle'
        ? `<circle cx="22" cy="31" r="3.5" fill="#3b2f2f"/><circle cx="21" cy="30" r="1.2" fill="#fff"/><circle cx="38" cy="31" r="3.5" fill="#3b2f2f"/><circle cx="37" cy="30" r="1.2" fill="#fff"/>`
        : `<circle cx="22" cy="31" r="2.8" fill="#3b2f2f"/><circle cx="38" cy="31" r="2.8" fill="#3b2f2f"/>`;
      const mouth = mood === 'cry'
        ? `<path d="M26 40 Q30 36 34 40" fill="none" stroke="#3b2f2f" stroke-width="2.5" stroke-linecap="round"/>`
        : `<path d="M26 36 Q28 39 30 36 Q32 39 34 36" fill="none" stroke="#3b2f2f" stroke-width="2.3" stroke-linecap="round"/>`;
      return `
        <svg class="${size} shrink-0" viewBox="0 0 60 60">
          <circle cx="15" cy="14" r="8.5" fill="#ffffff" stroke="#3b2f2f" stroke-width="3.2"/>
          <circle cx="15" cy="14" r="4" fill="#fbcfe8"/>
          <circle cx="45" cy="14" r="8.5" fill="#ffffff" stroke="#3b2f2f" stroke-width="3.2"/>
          <circle cx="45" cy="14" r="4" fill="#fbcfe8"/>
          <ellipse cx="30" cy="34" rx="23" ry="19" fill="#ffffff" stroke="#3b2f2f" stroke-width="3.2"/>
          <ellipse cx="17" cy="36" rx="4" ry="2.2" fill="#fda4af"/>
          <ellipse cx="43" cy="36" rx="4" ry="2.2" fill="#fda4af"/>
          ${eyes}
          ${mouth}
        </svg>
      `;
    }

    function svgHachi(size = 'w-16 h-16') {
      return `
        <svg class="${size} shrink-0" viewBox="0 0 60 60">
          <polygon points="10,22 16,6 26,17" fill="#7dd3fc" stroke="#3b2f2f" stroke-width="3.2" stroke-linejoin="round"/>
          <polygon points="50,22 44,6 34,17" fill="#7dd3fc" stroke="#3b2f2f" stroke-width="3.2" stroke-linejoin="round"/>
          <ellipse cx="30" cy="35" rx="23" ry="18.5" fill="#ffffff" stroke="#3b2f2f" stroke-width="3.2"/>
          <path d="M10 27 Q20 15 30 25 Q40 15 50 27 Q44 17 30 17 Q16 17 10 27 Z" fill="#7dd3fc"/>
          <ellipse cx="17" cy="37" rx="4" ry="2.2" fill="#fda4af"/>
          <ellipse cx="43" cy="37" rx="4" ry="2.2" fill="#fda4af"/>
          <circle cx="22" cy="32" r="2.8" fill="#3b2f2f"/>
          <circle cx="38" cy="32" r="2.8" fill="#3b2f2f"/>
          <path d="M26 37 Q28 40 30 37 Q32 40 34 37" fill="none" stroke="#3b2f2f" stroke-width="2.3" stroke-linecap="round"/>
        </svg>
      `;
    }

    function svgUsa(size = 'w-16 h-16') {
      return `
        <svg class="${size} shrink-0" viewBox="0 0 60 60">
          <ellipse cx="21" cy="13" rx="5.5" ry="11" fill="#fef08a" stroke="#3b2f2f" stroke-width="3.2"/>
          <ellipse cx="39" cy="13" rx="5.5" ry="11" fill="#fef08a" stroke="#3b2f2f" stroke-width="3.2"/>
          <ellipse cx="30" cy="37" rx="22" ry="17.5" fill="#fef9c3" stroke="#3b2f2f" stroke-width="3.2"/>
          <ellipse cx="17" cy="39" rx="4" ry="2.2" fill="#fda4af"/>
          <ellipse cx="43" cy="39" rx="4" ry="2.2" fill="#fda4af"/>
          <circle cx="22" cy="34" r="2.8" fill="#3b2f2f"/>
          <circle cx="38" cy="34" r="2.8" fill="#3b2f2f"/>
          <path d="M27 39 Q30 43 33 39" fill="#fda4af" stroke="#3b2f2f" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
      `;
    }

    function renderSlide() {
      const main = document.getElementById('slide-content');
      main.classList.remove('slide-fade');
      void main.offsetWidth;
      main.classList.add('slide-fade');

      const meta = slideMeta[currentSlide];
      document.getElementById('section-badge').textContent = meta.section;
      document.getElementById('slide-counter').textContent = `${currentSlide + 1} / ${totalSlides}`;

      document.querySelectorAll('.sec-pill').forEach(btn => {
        const sec = parseInt(btn.getAttribute('data-sec'), 10);
        if (sec === meta.secIdx) {
          btn.className = "sec-pill px-3 py-1 rounded-full font-extrabold bg-[#ff8fab] text-white border-2 border-[#3b2f2f]";
        } else {
          btn.className = "sec-pill px-2.5 py-1 rounded-full font-bold text-slate-500 hover:bg-pink-100";
        }
      });

      document.getElementById('prev-btn').disabled = (currentSlide === 0);
      const nextBtn = document.getElementById('next-btn');
      nextBtn.innerHTML = currentSlide === totalSlides - 1 ? `처음으로 ↺` : `다음 슬라이드 ▶`;

      renderDots();
      main.innerHTML = getSlideHTML(currentSlide);
    }

    function renderDots() {
      const container = document.getElementById('dots-container');
      let html = '';
      for (let i = 0; i < totalSlides; i++) {
        const active = (i === currentSlide);
        html += `<button onclick="goToSlide(${i})" class="h-3 rounded-full border-2 border-[#3b2f2f] transition-all ${active ? 'w-7 bg-[#ff8fab]' : 'w-3 bg-white hover:bg-pink-100'}"></button>`;
      }
      container.innerHTML = html;
    }

    function nextSlide() {
      currentSlide = (currentSlide < totalSlides - 1) ? currentSlide + 1 : 0;
      renderSlide();
    }
    function prevSlide() {
      if (currentSlide > 0) {
        currentSlide--;
        renderSlide();
      }
    }
    function goToSlide(idx) {
      currentSlide = idx;
      renderSlide();
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') nextSlide();
      if (e.key === 'ArrowLeft') prevSlide();
    });

    function getSlideHTML(idx) {
      switch (idx) {
        case 0: return renderSlide1();
        case 1: return renderSlide2();
        case 2: return renderSlide3();
        case 3: return renderSlide4();
        case 4: return renderSlide5();
        case 5: return renderSlide6();
        case 6: return renderSlide7();
        case 7: return renderSlide8();
        case 8: return renderSlide9();
        case 9: return renderSlide10();
        case 10: return renderSlide11();
        case 11: return renderSlide12();
        case 12: return renderSlide13();
        case 13: return renderSlide14();
        case 14: return renderSlide15();
        case 15: return renderSlide16();
        default: return '';
      }
    }

    // =========================================================================
    // SLIDE 1: [도입] 카페 금고 속 현금과 회계장부를 살펴보는 상황
    // =========================================================================
    function renderSlide1() {
      return `
        <div class="flex items-center justify-between bg-[#ffe4ec] chii-card-sm px-4 py-2 shrink-0">
          <div class="flex items-center gap-3">
            ${svgChii('sparkle', 'w-10 h-10')}
            <div>
              <span class="text-xs font-extrabold text-pink-700">1. 도입 · 카페 마감 시간의 미스터리!</span>
              <h2 class="font-cute text-lg lg:text-xl text-[#3b2f2f]">금고 속 현금과 회계장부, 어떻게 기록하고 맞출까?</h2>
            </div>
          </div>
          <span class="bg-white px-3 py-1 rounded-full text-xs font-extrabold border-2 border-[#3b2f2f]">상황 열기</span>
        </div>

        <!-- Side-by-Side Comparison: 카페 금고 vs 회계장부 -->
        <div class="grid grid-cols-2 gap-4 flex-1 min-h-0 items-stretch">
          <!-- Left: 카페 금고 -->
          <div class="chii-card-sm bg-[#fefce8] p-4 flex flex-col justify-between">
            <div class="flex items-center justify-between">
              <span class="bg-amber-500 text-[#3b2f2f] text-xs font-extrabold px-3 py-0.5 rounded-full border-2 border-[#3b2f2f]">🔐 카페 금고 속 보관물</span>
              <span class="text-xl">☕</span>
            </div>
            <div class="my-auto flex items-center gap-3 bg-white p-3 rounded-xl border-2 border-[#3b2f2f]">
              ${svgUsa('w-14 h-14')}
              <div class="space-y-1 text-xs font-bold text-slate-700">
                <div class="font-cute text-base text-[#3b2f2f]">"오늘 금고에 들어온 것들이야!"</div>
                <div>• 💵 지폐와 동전 (50,000원권, 10,000원권, 동전)</div>
                <div>• 🏦 손님이 내고 간 <strong>자기앞수표</strong></div>
                <div>• 🧾 옆 가게(거래처)가 발행해 준 <strong>당좌수표</strong></div>
              </div>
            </div>
            <div class="bg-amber-100 rounded-xl p-2 border-2 border-[#3b2f2f] text-center text-xs font-extrabold text-amber-900">
              ❓ 질문 1: 지폐·동전 말고 '수표'도 회계상 「현금」일까?
            </div>
          </div>

          <!-- Right: 회계장부 -->
          <div class="chii-card-sm bg-[#e0f2fe] p-4 flex flex-col justify-between">
            <div class="flex items-center justify-between">
              <span class="bg-sky-600 text-white text-xs font-extrabold px-3 py-0.5 rounded-full border-2 border-[#3b2f2f]">📒 카페 회계장부 잔액</span>
              <span class="text-xl">🧮</span>
            </div>
            <div class="my-auto flex items-center gap-3 bg-white p-3 rounded-xl border-2 border-[#3b2f2f]">
              ${svgHachi('w-14 h-14')}
              <div class="space-y-1 text-xs font-bold text-slate-700">
                <div class="font-cute text-base text-[#3b2f2f]">"어라? 장부랑 금고 돈이 왜 다르지?"</div>
                <div>• 장부상 현금 잔액: <strong class="font-mono text-indigo-700">100,000원</strong></div>
                <div>• 실제 금고 보관액: <strong class="font-mono text-rose-600">130,000원 (또는 70,000원)</strong></div>
                <div>• 마감 시간인데 왜 차이가 나는지 아직 모르겠어!</div>
              </div>
            </div>
            <div class="bg-sky-100 rounded-xl p-2 border-2 border-[#3b2f2f] text-center text-xs font-extrabold text-sky-900">
              ❓ 질문 2: 원인을 모를 때 장부와 실제 현금을 어떻게 맞출까?
            </div>
          </div>
        </div>

        <div class="bg-[#3b2f2f] text-white rounded-xl px-4 py-1.5 text-center text-xs font-bold shrink-0">
          💡 오늘 수업을 통해 <strong>① 회계상 현금의 범위와 수표 처리</strong>, <strong>② 현금과부족의 회계 처리</strong>를 완벽히 해결해 보자!
        </div>
      `;
    }

    // =========================================================================
    // SLIDE 2: [도입] 오늘의 5가지 학습 목표
    // =========================================================================
    function renderSlide2() {
      const goals = [
        { num: "01", title: "현금의 의미와 범위", desc: "일상의 현금(통화)과 회계상 현금(통화대용증권 포함)의 범위를 설명할 수 있어요.", bg: "bg-[#ffe4ec]" },
        { num: "02", title: "동점 vs 당점수표 구별", desc: "동점발행수표(현금)와 당점발행수표(당좌예금)를 구별해 분개할 수 있어요.", bg: "bg-[#e0f2fe]" },
        { num: "03", title: "현금과부족 발생 분개", desc: "장부금액과 실제 금고 보관액을 비교하여 현금과부족 발생을 분개할 수 있어요.", bg: "bg-[#fef9c3]" },

              </div>
