<!doctype html>
<!-- PART 1/5 -->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>카페 사장님의 장부 미션 | 당좌자산</title>
  <style>
    :root {
      --bg: #FFF8EF;
      --surface: #FFFFFF;
      --surface-soft: #FDF3E4;
      --surface-warm: #F9EBD4;
      --ink: #2B211B;
      --ink-muted: #5C493E;
      --primary: #176047;
      --primary-hover: #114A36;
      --primary-soft: #E6F3ED;
      --accent: #F4D58D;
      --accent-soft: #FFF4D4;
      --accent-ink: #5A3E00;
      --border: #DECBB7;
      --border-strong: #B99D82;
      --ok-bg: #E7F6EF;
      --ok-border: #176047;
      --ok-ink: #0F4734;
      --err-bg: #FDECEC;
      --err-border: #B3261E;
      --err-ink: #8C1D18;
      --warn-bg: #FFF3D1;
      --warn-border: #A86B00;
      --warn-ink: #6A4300;
      --debit-bg: #EEF4FA;
      --debit-ink: #1D4B7A;
      --credit-bg: #F9EFE8;
      --credit-ink: #7D3C12;
      --shadow: 0 2px 10px rgba(43, 33, 27, 0.06);
      --radius: 14px;
      --radius-sm: 9px;
      --font-body: clamp(16px, 1.35vw, 23px);
      --font-small: clamp(14px, 1.05vw, 18px);
      --font-h1: clamp(22px, 2.2vw, 34px);
      --font-h2: clamp(19px, 1.75vw, 28px);
      --font-h3: clamp(17px, 1.4vw, 23px);
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      background-color: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
      line-height: 1.55;
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      color: var(--ink);
      font-size: var(--font-body);
      min-height: 100vh;
    }

    a {
      color: var(--primary);
    }

    button, input {
      font: inherit;
      color: inherit;
    }

    button:focus-visible,
    a:focus-visible,
    input:focus-visible,
    summary:focus-visible {
      outline: 3px solid var(--primary);
      outline-offset: 2px;
    }

    /* 상단 고정 헤더 */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 40;
      background-color: rgba(255, 248, 239, 0.97);
      border-bottom: 2px solid var(--border);
      backdrop-filter: blur(4px);
    }

    .header-top {
      max-width: 1360px;
      margin: 0 auto;
      padding: 10px 14px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .header-left {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .library-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 7px 13px;
      border-radius: 999px;
      border: 2px solid var(--primary);
      background-color: var(--surface);
      color: var(--primary);
      text-decoration: none;
      font-weight: 700;
      font-size: var(--font-small);
      white-space: nowrap;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .library-link:hover {
      background-color: var(--primary);
      color: #FFFFFF;
    }

    .brand-title {
      font-weight: 800;
      font-size: clamp(16px, 1.3vw, 21px);
      color: var(--ink);
      letter-spacing: -0.02em;
    }

    .mode-switcher {
      display: inline-flex;
      background-color: var(--surface-warm);
      border: 1.5px solid var(--border-strong);
      border-radius: 999px;
      padding: 3px;
      gap: 4px;
      max-width: 100%;
    }

    .mode-btn {
      border: none;
      background: transparent;
      color: var(--ink);
      padding: 6px 14px;
      border-radius: 999px;
      font-weight: 700;
      font-size: var(--font-small);
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .mode-btn[aria-pressed="true"] {
      background-color: var(--primary);
      color: #FFFFFF;
    }

    /* 탐색 줄 */
    .app-nav {
      background-color: var(--surface-soft);
      border-bottom: 1.5px solid var(--border);
    }

    .nav-inner {
      max-width: 1360px;
      margin: 0 auto;
      padding: 8px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .nav-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .slide-counter {
      display: inline-flex;
      align-items: center;
      padding: 4px 11px;
      border-radius: 999px;
      background-color: var(--ink);
      color: #FFF8EF;
      font-weight: 800;
      font-size: var(--font-small);
      white-space: nowrap;
    }

    .period-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .period-btn {
      border: 1.5px solid var(--border-strong);
      background-color: var(--surface);
      color: var(--ink);
      padding: 5px 11px;
      border-radius: var(--radius-sm);
      font-weight: 700;
      font-size: var(--font-small);
      cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .period-btn.is-active {
      background-color: var(--accent);
      border-color: var(--accent-ink);
      color: var(--ink);
    }

    .slide-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .slide-pill {
      border: 1.5px solid var(--border);
      background-color: var(--surface);
      color: var(--ink);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: clamp(13px, 0.95vw, 16px);
      font-weight: 700;
      cursor: pointer;
      min-width: 40px;
      text-align: center;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .slide-pill.is-active {
      background-color: var(--primary);
      border-color: var(--primary);
      color: #FFFFFF;
    }

    /* 메인 슬라이드 컨테이너 */
    .slide-main {
      max-width: 1360px;
      margin: 0 auto;
      padding: 18px 14px 44px;
      scroll-margin-top: 120px;
    }

    .slide-stage {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* 상단 개념 + 거래 카드 */
    .top-banner {
      background-color: var(--surface);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: clamp(16px, 2vw, 24px);
      box-shadow: var(--shadow);
    }

    .slide-meta-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: var(--font-small);
      font-weight: 800;
    }

    .badge-period {
      background-color: var(--accent-soft);
      border: 1px solid var(--accent-ink);
      color: var(--accent-ink);
    }

    .badge-concept {
      background-color: var(--primary-soft);
      border: 1px solid var(--primary);
      color: var(--primary);
    }

    .slide-title {
      margin: 0 0 10px;
      font-size: var(--font-h1);
      line-height: 1.28;
      color: var(--ink);
      letter-spacing: -0.02em;
    }

    .concept-note {
      margin: 0 0 10px;
      color: var(--ink-muted);
      font-size: var(--font-body);
    }

    .story-box {
      background-color: var(--surface-soft);
      border-left: 5px solid var(--primary);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      padding: 12px 16px;
      margin-top: 10px;
    }

    .story-box p {
      margin: 4px 0;
    }

    .story-tag {
      font-weight: 800;
      color: var(--primary);
      margin-right: 6px;
    }

    /* 중간 2열(도식 + 장부/비교) */
    .mid-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    @media (min-width: 920px) {
      .mid-grid.is-two-col {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        align-items: stretch;
      }
    }

    .panel-card {
      background-color: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: clamp(14px, 1.8vw, 22px);
      box-shadow: var(--shadow);
      min-width: 0;
    }

    .panel-title {
      margin: 0 0 12px;
      font-size: var(--font-h3);
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .svg-frame {
      width: 100%;
      overflow: hidden;
      border-radius: var(--radius-sm);
      background-color: #FFFDF9;
      border: 1px solid var(--border);
      padding: 10px;
    }

    .svg-frame svg {
      display: block;
      width: 100%;
      height: auto;
      max-width: 100%;
    }

    /* 비교 표 & 미니 카드 */
    .info-table-wrap {
      width: 100%;
      overflow-x: auto;
    }

    .info-table {
      width: 100%;
      border-collapse: collapse;
      font-size: var(--font-small);
    }

    .info-table th,
    .info-table td {
      border: 1.5px solid var(--border);
      padding: 9px 10px;
      text-align: left;
      vertical-align: top;
    }

    .info-table th {
      background-color: var(--surface-warm);
      color: var(--ink);
      font-weight: 800;
    }

    .callout-tip {
      margin-top: 10px;
      padding: 10px 13px;
      border-radius: var(--radius-sm);
      background-color: var(--accent-soft);
      border: 1.5px solid #D7B45A;
      color: var(--ink);
      font-size: var(--font-small);
    }

    /* 하단 활동 / 문제 영역 */
    .tasks-stack {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .task-card {
      background-color: var(--surface);
      border: 2px solid var(--border-strong);
      border-radius: var(--radius);
      padding: clamp(14px, 1.8vw, 22px);
      box-shadow: var(--shadow);
      min-width: 0;
    }

    .task-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .task-label {
      font-weight: 800;
      font-size: var(--font-h3);
      color: var(--ink);
      margin: 0;
    }

    .task-prompt {
      margin: 0 0 12px;
      color: var(--ink);
    }

    /* 아코디언형 그룹(20장 등) */
    .task-details {
      border: 2px solid var(--border-strong);
      border-radius: var(--radius);
      background-color: var(--surface);
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .task-details > summary {
      list-style: none;
      cursor: pointer;
      padding: 14px 18px;
      background-color: var(--surface-soft);
      font-weight: 800;
      font-size: var(--font-h3);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 1.5px solid transparent;
    }

    .task-details[open] > summary {
      border-bottom-color: var(--border);
    }

    .task-details > summary::-webkit-details-marker {
      display: none;
    }

    .task-details-body {
      padding: clamp(14px, 1.8vw, 22px);
    }

    /* 버튼 공통 */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 18px;
      border-radius: var(--radius-sm);
      border: 2px solid transparent;
      font-weight: 800;
      font-size: var(--font-small);
      cursor: pointer;
      min-height: 44px;
      transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }

    .btn-primary {
      background-color: var(--primary);
      color: #FFFFFF;
    }

    .btn-primary:hover:not(:disabled) {
      background-color: var(--primary-hover);
    }

    .btn-secondary {
      background-color: var(--surface-soft);
      border-color: var(--border-strong);
      color: var(--ink);
    }

    .btn-secondary:hover:not(:disabled) {
      background-color: var(--surface-warm);
    }

    .btn-accent {
      background-color: var(--accent);
      border-color: var(--accent-ink);
      color: var(--ink);
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .action-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-top: 14px;
    }

    /* 전자칠판 수업 모드 판서용 빈칸 */
    .board-blank {
      border: 2.5px dashed var(--border-strong);
      border-radius: var(--radius-sm);
      background-color: #FFFDF9;
      padding: 16px;
      margin: 10px 0;
    }

    .board-journal-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    @media (min-width: 760px) {
      .board-journal-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    .board-side {
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px;
      background-color: var(--surface);
    }

    .board-side-title {
      font-weight: 800;
      font-size: var(--font-small);
      margin-bottom: 10px;
      display: inline-block;
      padding: 2px 10px;
      border-radius: 6px;
    }

    .side-debit {
      background-color: var(--debit-bg);
      color: var(--debit-ink);
    }

    .side-credit {
      background-color: var(--credit-bg);
      color: var(--credit-ink);
    }

    .board-write-row {
      display: grid;
      grid-template-columns: 1.3fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }

    .board-write-row:last-child {
      margin-bottom: 0;
    }

    .board-cell {
      min-height: 54px;
      border-bottom: 2px solid var(--border-strong);
      background-color: #FFFEFC;
      border-radius: 6px 6px 0 0;
      padding: 6px 8px;
      font-size: clamp(13px, 0.95vw, 15px);
      color: var(--ink-muted);
      display: flex;
      align-items: flex-end;
    }

    /* 한 줄 분개 정답 출력 (모바일 가로 스크롤 격리) */
    .journal-answer-line {
      overflow-x: auto;
      white-space: nowrap;
      -webkit-overflow-scrolling: touch;
      background-color: var(--surface);
      border: 2px solid var(--primary);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      margin: 10px 0 8px;
      font-weight: 800;
      font-size: clamp(16px, 1.35vw, 22px);
      color: var(--ink);
    }

    .j-tag {
      display: inline-block;
      padding: 1px 7px;
      border-radius: 5px;
      margin-right: 4px;
      font-weight: 800;
    }

    .j-gap {
      display: inline-block;
      width: 2.2em;
    }

    /* 피드백 박스 */
    .feedback-box {
      margin-top: 12px;
      padding: 12px 15px;
      border-radius: var(--radius-sm);
      border: 2px solid var(--border);
      font-size: var(--font-small);
    }

    .feedback-box p {
      margin: 4px 0;
    }

    .feedback-ok {
      background-color: var(--ok-bg);
      border-color: var(--ok-border);
      color: var(--ok-ink);
    }

    .feedback-err {
      background-color: var(--err-bg);
      border-color: var(--err-border);
      color: var(--err-ink);
    }

    .feedback-warn {
      background-color: var(--warn-bg);
      border-color: var(--warn-border);
      color: var(--warn-ink);
    }

    .feedback-info {
      background-color: var(--surface-soft);
      border-color: var(--primary);
      color: var(--ink);
    }

    .status-pill {
      display: inline-block;
      font-weight: 800;
      margin-right: 6px;
    }

    /* 선택형 버튼 */
    .choice-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin: 10px 0;
    }

    @media (min-width: 640px) {
      .choice-grid.cols-3 {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .choice-grid.cols-2 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    .choice-btn {
      width: 100%;
      text-align: left;
      padding: 12px 14px;
      border: 2px solid var(--border-strong);
      border-radius: var(--radius-sm);
      background-color: var(--surface);
      color: var(--ink);
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      min-height: 48px;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .choice-btn:hover {
      background-color: var(--surface-soft);
      border-color: var(--primary);
    }

    .choice-btn.is-selected {
      background-color: var(--accent-soft);
      border-color: var(--accent-ink);
    }

    .choice-btn.is-correct {
      background-color: var(--ok-bg);
      border-color: var(--ok-border);
      color: var(--ok-ink);
    }

    .choice-btn.is-wrong {
      background-color: var(--err-bg);
      border-color: var(--err-border);
      color: var(--err-ink);
    }

    .choice-num {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background-color: var(--surface-warm);
      color: var(--ink);
      font-size: 0.9em;
      font-weight: 800;
    }

    .choice-text {
      flex: 1 1 auto;
      min-width: 0;
      overflow-x: auto;
    }

    /* 칩 뱅크 & 드래그/탭 분류 */
    .chip-bank-wrap {
      background-color: var(--surface-soft);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px;
      margin-bottom: 12px;
    }

    .chip-bank-help {
      margin: 0 0 8px;
      font-size: var(--font-small);
      color: var(--ink-muted);
    }

    .chip-bank {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      border-radius: 999px;
      border: 2px solid var(--primary);
      background-color: var(--surface);
      color: var(--ink);
      font-weight: 700;
      font-size: var(--font-small);
      cursor: pointer;
      text-align: left;
      max-width: 100%;
      touch-action: manipulation;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .chip-btn.is-selected {
      background-color: var(--accent);
      border-color: var(--accent-ink);
      box-shadow: 0 0 0 2px var(--accent-ink);
    }

    .chip-btn.is-placed {
      background-color: var(--primary-soft);
      border-color: var(--primary);
      border-radius: var(--radius-sm);
      width: 100%;
      justify-content: space-between;
    }

    .chip-drag-handle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 2px 5px;
      border-radius: 6px;
      background-color: var(--surface-warm);
      color: var(--ink-muted);
      font-weight: 800;
      letter-spacing: -1px;
      touch-action: none;
      cursor: grab;
      user-select: none;
      flex: 0 0 auto;
    }

    .chip-selected-tag {
      font-size: 0.8em;
      padding: 1px 6px;
      border-radius: 999px;
      background-color: var(--ink);
      color: #FFF8EF;
      margin-left: 4px;
      white-space: nowrap;
    }

    .drop-buckets {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    @media (min-width: 760px) {
      .drop-buckets.cols-3 {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .drop-buckets.cols-2 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    .drop-zone {
      border: 2px dashed var(--border-strong);
      border-radius: var(--radius-sm);
      background-color: #FFFDF9;
      padding: 12px;
      min-height: 112px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .drop-zone.is-ready {
      border-color: var(--primary);
      background-color: var(--primary-soft);
    }

    .drop-zone.is-drag-over {
      border-style: solid;
      border-color: var(--accent-ink);
      background-color: var(--accent-soft);
    }

    .drop-zone-head {
      width: 100%;
      border: none;
      background: var(--surface-warm);
      color: var(--ink);
      font-weight: 800;
      font-size: var(--font-small);
      padding: 7px 10px;
      border-radius: 7px;
      text-align: left;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }

    .drop-zone-items {
      display: flex;
      flex-direction: column;
      gap: 7px;
      flex: 1 1 auto;
    }

    .drop-placeholder {
      font-size: var(--font-small);
      color: var(--ink-muted);
      padding: 6px 2px;
    }

    /* 슬롯형 카드(21장, 26장) */
    .slot-card {
      border: 1.5px solid var(--border-strong);
      border-radius: var(--radius-sm);
      background-color: var(--surface);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .slot-target-btn {
      width: 100%;
      min-height: 48px;
      padding: 8px 12px;
      border: 2px dashed var(--border-strong);
      border-radius: var(--radius-sm);
      background-color: #FFFDF9;
      color: var(--ink);
      font-weight: 700;
      font-size: var(--font-small);
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .slot-target-btn.is-filled {
      border-style: solid;
      border-color: var(--primary);
      background-color: var(--primary-soft);
    }

    .slot-target-btn.is-ready {
      border-color: var(--accent-ink);
      background-color: var(--accent-soft);
    }

    /* 분개 학생 입력 UI */
    .journal-editor {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      margin-top: 10px;
    }

    @media (min-width: 860px) {
      .journal-editor {
        grid-template-columns: 1fr 1fr;
      }
    }

    .journal-side-box {
      border: 1.5px solid var(--border-strong);
      border-radius: var(--radius-sm);
      padding: 12px;
      background-color: #FFFDF9;
    }

    .journal-row {
      display: grid;
      grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr);
      gap: 8px;
      margin-top: 8px;
      align-items: center;
    }

    @media (max-width: 420px) {
      .journal-row {
        grid-template-columns: 1fr;
      }
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
      min-width: 0;
    }

    .text-input {
      width: 100%;
      min-height: 44px;
      padding: 8px 32px 8px 11px;
      border: 2px solid var(--border-strong);
      border-radius: var(--radius-sm);
      background-color: var(--surface);
      color: var(--ink);
      font-size: var(--font-small);
      font-weight: 700;
    }

    .text-input.amount-input {
      padding-right: 11px;
      text-align: right;
    }

    .text-input.is-drop-ready {
      border-color: var(--primary);
      background-color: var(--accent-soft);
    }

    .text-input.is-drag-over {
      border-color: var(--accent-ink);
      background-color: var(--accent);
    }

    .input-clear-btn {
      position: absolute;
      right: 6px;
      border: none;
      background: transparent;
      color: var(--ink-muted);
      font-weight: 800;
      cursor: pointer;
      padding: 4px 6px;
      font-size: 16px;
      line-height: 1;
    }

    /* 계산 단계 입력(8, 12, 15, 16, 17장) */
    .calc-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin: 10px 0;
    }

    @media (min-width: 640px) {
      .calc-grid.cols-2 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    .calc-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background-color: var(--surface-soft);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
    }

    .calc-field label {
      font-weight: 800;
      font-size: var(--font-small);
    }

    .seg-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .seg-btn {
      flex: 1 1 100px;
      min-height: 42px;
      padding: 6px 12px;
      border: 2px solid var(--border-strong);
      border-radius: var(--radius-sm);
      background-color: var(--surface);
      color: var(--ink);
      font-weight: 800;
      font-size: var(--font-small);
      cursor: pointer;
    }

    .seg-btn.is-selected {
      background-color: var(--primary);
      border-color: var(--primary);
      color: #FFFFFF;
    }

    /* 총계정원장 T형 표 (14장, 18장) */
    .t-account-wrap {
      margin: 10px 0;
      border: 2px solid var(--ink);
      border-radius: var(--radius-sm);
      background-color: var(--surface);
      overflow-x: auto;
    }

    .t-account-title {
      text-align: center;
      font-weight: 900;
      font-size: var(--font-h3);
      padding: 8px 12px;
      background-color: var(--surface-warm);
      border-bottom: 3px solid var(--ink);
    }

    .t-account-table {
      width: 100%;
      min-width: 480px;
      border-collapse: collapse;
      font-size: var(--font-small);
      table-layout: fixed;
    }

    .t-account-table th,
    .t-account-table td {
      padding: 8px 7px;
      border-bottom: 1px solid var(--border);
      border-right: 1px solid var(--border);
      text-align: left;
      vertical-align: middle;
      word-break: keep-all;
    }

    .t-account-table th {
      background-color: var(--surface-soft);
      font-weight: 800;
      text-align: center;
    }

    .t-account-table td.num {
      text-align: right;
      font-variant-numeric: tabular-nums;
      font-weight: 700;
    }

    .t-account-table .t-center-divider {
      border-right: 3px solid var(--ink);
    }

    .t-account-table th:last-child,
    .t-account-table td:last-child {
      border-right: none;
    }

    /* 커버 슬라이드 (1장) */
    .cover-hero {
      background-color: var(--surface);
      border: 2px solid var(--border-strong);
      border-radius: var(--radius);
      padding: clamp(18px, 2.5vw, 30px);
      box-shadow: var(--shadow);
    }

    .cover-periods {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-top: 16px;
    }

    @media (min-width: 680px) {
      .cover-periods {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    .period-card-btn {
      text-align: left;
      background-color: var(--surface-soft);
      border: 2px solid var(--border-strong);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 4px;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .period-card-btn:hover {
      background-color: var(--accent-soft);
      border-color: var(--primary);
    }

    .period-card-tag {
      font-size: var(--font-small);
      font-weight: 800;
      color: var(--primary);
    }

    .period-card-title {
      font-size: var(--font-h3);
      font-weight: 900;
      color: var(--ink);
    }

    .period-card-desc {
      font-size: var(--font-small);
      color: var(--ink-muted);
    }

    /* 7장 출구 미션 3단계 카드 */
    .flow-card-strip {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      font-size: var(--font-small);
    }

    .flow-pill {
      padding: 4px 10px;
      border-radius: 8px;
      background-color: var(--surface-warm);
      border: 1px solid var(--border-strong);
      font-weight: 700;
    }

    /* 27장 연습 결과 막대 */
    .challenge-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      background-color: var(--accent-soft);
      border: 2px solid var(--accent-ink);
      font-weight: 800;
      font-size: var(--font-small);

    /* 하단 이전/다음 탐색 */
    .slide-footer-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 22px;
      padding-top: 16px;

    }

    .drag-ghost {
      position: fixed;
      z-index: 9999;
      pointer-events: none;
      padding: 8px 14px;
      border-radius: 999px;
      background-color: var(--primary);
      color: #FFFFFF;
      font-weight: 800;
      font-size: 15px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.22);
      transform: translate(-50%, -50%);
      max-width: 260px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }
      *, *::before, *::after {
        transition: none !important;
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-top">
      <div class="header-left">
        <a class="library-link" href="https://rollers765-eng.github.io/seoul-tourism-student-apps/accounting-library/">← 자료실</a>
        <span class="brand-title">카페 사장님의 장부 미션 | 당좌자산</span>
      </div>
      <div class="mode-switcher" role="group" aria-label="학습 모드 선택">
        <button type="button" class="mode-btn" id="btnModeTeacher" data-mode="teacher" aria-pressed="true">수업 모드</button>
        <button type="button" class="mode-btn" id="btnModeStudent" data-mode="student" aria-pressed="false">혼자 공부 모드</button>
      </div>
    </div>
    <nav class="app-nav" aria-label="차시 및 슬라이드 탐색">
      <div class="nav-inner">
        <div class="nav-row">
          <span class="slide-counter" id="slideCounter">1 / 28장</span>
          <div class="period-tabs" id="periodTabs"></div>
        </div>
        <div class="slide-pills" id="slidePills" aria-label="현재 차시 슬라이드 선택"></div>
      </div>
    </nav>
  </header>

  <main class="slide-main" id="slideMain" tabindex="-1">
    <noscript>
      <div class="panel-card">
        <p><strong>자바스크립트가 꺼져 있습니다.</strong> 상단의 ‘← 자료실’ 링크는 그대로 이용할 수 있으며, 인터랙티브 분개 실습을 이용하려면 자바스크립트를 켜 주세요.</p>
      </div>
    </noscript>
    <div id="slideRoot" class="slide-stage"></div>
  </main>

  <script>
    window.APP_CONFIG = {
      libraryUrl: 'https://rollers765-eng.github.io/seoul-tourism-student-apps/accounting-library/',
      periods: [
        { id: 1, label: '1차시 · 현금과 수표', shortLabel: '1차시', start: 1, end: 7, desc: '현금·현금성자산, 당좌수표, 자기앞수표' },
        { id: 2, label: '2차시 · 현금과부족·당좌차월', shortLabel: '2차시', start: 8, end: 14, desc: '장부 대조, 현금과부족, 당좌차월과 전기' },
        { id: 3, label: '3차시 · 단기매매증권·받을어음', shortLabel: '3차시', start: 15, end: 20, desc: '취득·기말평가, 원장 전기, 어음 배서양도' },
        { id: 4, label: '4차시 · 기타채권·마무리', shortLabel: '4차시', start: 21, end: 28, desc: '가지급금·선급금·미수금, 6문항 챌린지' }
      ]
    };

    window.SLIDES = [];

    window.APP_STATE = {
      currentSlideId: 1,
      mode: 'teacher', // 기본값: 수업 모드
      revealedTasks: {}, // 장/모드 이동 시 초기화
      student: {
        choices: {},   // taskId -> { selectedIndex, checked, showExplain }
        classify: {},  // taskId -> { placements: { itemId: targetId }, checked, showExplain }
        calc: {},      // taskId -> { values: { fieldKey: val }, checked, showExplain }
        journal: {},   // taskId -> { debit: [{account, amount}], credit: [{account, amount}], checked, showExplain }
        ledger: {},    // taskId -> { values: {}, checked, showExplain }
        challenge27: {} // qId -> { selectedIndex, isCorrect }
      },
      selectedChip: null, // { taskId, value, label, kind: 'classify'|'journal' }
      drag: null
    };

    /* =========================
       공통 유틸리티 및 정규화
       ========================= */
    function escapeHtml(str) {
      return String(str == null ? '' : str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatWon(num) {
      if (typeof num !== 'number' || !Number.isFinite(num)) return '';
      return num.toLocaleString('ko-KR');
    }

    function normalizeAccount(str) {
      return String(str == null ? '' : str).trim().replace(/\s+/g, '');
    }

    function parseAmount(raw) {
      if (raw == null) return null;
      var s = String(raw).trim();
      if (!s) return null;
      s = s.replace(/\s+/g, '').replace(/,/g, '').replace(/원$/, '');
      if (!/^\d+$/.test(s)) return null;
      var n = parseInt(s, 10);
      return Number.isSafeInteger(n) ? n : null;
    }

    function formatJournalOneLineHtml(entry) {
      var left = entry.debit.map(function (it) {
        return escapeHtml(it.account) + ' ' + formatWon(it.amount);
      }).join(', ');
      var right = entry.credit.map(function (it) {
        return escapeHtml(it.account) + ' ' + formatWon(it.amount);
      }).join(', ');
      return '<div class="journal-answer-line" tabindex="0" aria-label="정답 분개">' +
        '<span class="j-tag side-debit">(차)</span> ' + left +
        '<span class="j-gap" aria-hidden="true"></span>' +
        '<span class="j-tag side-credit">(대)</span> ' + right +
        '</div>';
    }

    function getSlideById(id) {
      for (var i = 0; i < window.SLIDES.length; i++) {
        if (window.SLIDES[i].id === id) return window.SLIDES[i];
      }
      return window.SLIDES[0] || null;
    }

    function getPeriodForSlide(slideId) {
      var list = window.APP_CONFIG.periods;
      for (var i = 0; i < list.length; i++) {
        if (slideId >= list[i].start && slideId <= list[i].end) return list[i];
      }
      return list[0];
    }

    /* =========================
       분개 채점 로직
       ========================= */
    function gradeJournalEntry(expected, userDebit, userCredit) {
      var dExpected = expected.debit || [];
      var cExpected = expected.credit || [];

      var dRows = (userDebit || []).filter(function (r) {
        return normalizeAccount(r.account) !== '' || String(r.amount || '').trim() !== '';
      });
      var cRows = (userCredit || []).filter(function (r) {
        return normalizeAccount(r.account) !== '' || String(r.amount || '').trim() !== '';
      });

      // 미완성 여부 확인
      if (dRows.length < dExpected.length || cRows.length < cExpected.length) {
        return {
          status: 'incomplete',
          message: '차변과 대변의 계정과목 및 금액 빈칸을 모두 채워 주세요.'
        };
      }

      var allRows = dRows.concat(cRows);
      for (var i = 0; i < allRows.length; i++) {
        if (!normalizeAccount(allRows[i].account) || String(allRows[i].amount || '').trim() === '') {
          return {
            status: 'incomplete',
            message: '계정과목과 금액 중 비어 있는 칸이 있습니다.'
          };
        }
      }

      // 금액 유효성 확인 (공란·문자·0원 방지)
      var parsedD = [];
      var parsedC = [];
      for (var j = 0; j < dRows.length; j++) {
        var amtD = parseAmount(dRows[j].amount);
        if (amtD === null || amtD <= 0) {
          return {
            status: 'wrong',
            message: '차변 금액을 올바른 숫자(원 단위)로 입력해 주세요. 예: 180,000'
          };
        }
        parsedD.push({ account: normalizeAccount(dRows[j].account), amount: amtD });
      }
      for (var k = 0; k < cRows.length; k++) {
        var amtC = parseAmount(cRows[k].amount);
        if (amtC === null || amtC <= 0) {
          return {
            status: 'wrong',
            message: '대변 금액을 올바른 숫자(원 단위)로 입력해 주세요. 예: 180,000'
          };
        }
        parsedC.push({ account: normalizeAccount(cRows[k].account), amount: amtC });
      }

      // 같은 계정 좌우 중복 입력 차단
      var debitAccSet = {};
      for (var a = 0; a < parsedD.length; a++) {
        if (debitAccSet[parsedD[a].account]) {
          return {
            status: 'wrong',
            message: '차변에 같은 계정과목을 중복 입력했습니다. 계정과목을 다시 확인해 보세요.'
          };
        }
        debitAccSet[parsedD[a].account] = true;
      }
      var creditAccSet = {};
      for (var b = 0; b < parsedC.length; b++) {
        if (debitAccSet[parsedC[b].account]) {
          return {
            status: 'wrong',
            message: '같은 계정과목을 차변과 대변에 동시에 넣을 수 없습니다. 증가·감소 방향을 다시 살펴보세요.'
          };
        }
        if (creditAccSet[parsedC[b].account]) {
          return {
            status: 'wrong',
            message: '대변에 같은 계정과목을 중복 입력했습니다. 계정과목을 다시 확인해 보세요.'
          };
        }
        creditAccSet[parsedC[b].account] = true;
      }

      // 차대 합계 검사
      var sumD = parsedD.reduce(function (s, x) { return s + x.amount; }, 0);
      var sumC = parsedC.reduce(function (s, x) { return s + x.amount; }, 0);
      if (sumD !== sumC) {
        return {
          status: 'wrong',
          message: '차변 합계(' + formatWon(sumD) + '원)와 대변 합계(' + formatWon(sumC) + '원)가 일치하지 않습니다.'
        };
      }

      // 순서 무관 매칭 (같은 쪽 내 계정+금액 짝 비교)
      function sideMatches(expList, usrList) {
        if (expList.length !== usrList.length) return false;
        var expKeys = expList.map(function (x) { return normalizeAccount(x.account) + '|' + x.amount; }).sort();
        var usrKeys = usrList.map(function (x) { return x.account + '|' + x.amount; }).sort();
        for (var idx = 0; idx < expKeys.length; idx++) {
          if (expKeys[idx] !== usrKeys[idx]) return false;
        }
        return true;
      }

      var okD = sideMatches(dExpected, parsedD);
      var okC = sideMatches(cExpected, parsedC);

      if (okD && okC) {
        return { status: 'correct', message: '' };
      }

      var wrongParts = [];
      if (!okD) wrongParts.push('차변(왼쪽)');
      if (!okC) wrongParts.push('대변(오른쪽)');
      return {
        status: 'wrong',
        message: wrongParts.join('과 ') + '의 계정과목 또는 금액을 다시 확인해 보세요.'
      };
    }

    /* =========================
       학생 상태 초기화 헬퍼
       ========================= */
    function ensureJournalState(task) {
      if (!window.APP_STATE.student.journal[task.id]) {
        var dLen = task.answer.debit.length;
        var cLen = task.answer.credit.length;
        var dArr = [];
        var cArr = [];
        for (var i = 0; i < dLen; i++) dArr.push({ account: '', amount: '' });
        for (var j = 0; j < cLen; j++) cArr.push({ account: '', amount: '' });
        window.APP_STATE.student.journal[task.id] = {
          debit: dArr,
          credit: cArr,
          checked: null,
          showExplain: false
        };
      }
      return window.APP_STATE.student.journal[task.id];
    }

    function ensureClassifyState(task) {
      if (!window.APP_STATE.student.classify[task.id]) {
        window.APP_STATE.student.classify[task.id] = {
          placements: {},
          checked: null,
          showExplain: false
        };
      }
      return window.APP_STATE.student.classify[task.id];
    }

    function ensureCalcState(task) {
      if (!window.APP_STATE.student.calc[task.id]) {
        window.APP_STATE.student.calc[task.id] = {
          values: {},
          checked: null,
          showExplain: false
        };
      }
      return window.APP_STATE.student.calc[task.id];
    }

    function ensureLedgerState(task) {
      if (!window.APP_STATE.student.ledger[task.id]) {
        window.APP_STATE.student.ledger[task.id] = {
          values: {},
          checked: null,
          showExplain: false
        };
      }
      return window.APP_STATE.student.ledger[task.id];
    }

    function ensureChoiceState(task) {
      if (!window.APP_STATE.student.choices[task.id]) {
        window.APP_STATE.student.choices[task.id] = {
          selectedIndex: null,
          checked: null,
          showExplain: false
        };
      }
      return window.APP_STATE.student.choices[task.id];
    }

    /* =========================
       네비게이션 및 모드 전환
       ========================= */
    function setMode(newMode) {
      if (newMode !== 'teacher' && newMode !== 'student') return;
      window.APP_STATE.mode = newMode;
      window.APP_STATE.revealedTasks = {}; // 모드 이동 시 수업 모드 정답 숨김
      window.APP_STATE.selectedChip = null;
      renderAll();
    }

    function goToSlide(slideId, shouldScroll) {
      var target = getSlideById(slideId);
      if (!target) return;
      window.APP_STATE.currentSlideId = target.id;
      window.APP_STATE.revealedTasks = {}; // 다른 장 이동 시 정답 다시 숨김
      window.APP_STATE.selectedChip = null;
      renderAll();
      if (shouldScroll !== false) {
        var mainEl = document.getElementById('slideMain');
        if (mainEl) {
          mainEl.scrollIntoView({ behavior: 'auto', block: 'start' });
        } else {
          window.scrollTo(0, 0);
        }
      }
    }

    function resetChallenge27() {
      window.APP_STATE.student.challenge27 = {};
      var s27 = getSlideById(27);
      if (s27 && s27.tasks) {
        s27.tasks.forEach(function (t) {
          delete window.APP_STATE.student.choices[t.id];
        });
      }
      goToSlide(27, true);
    }

    function getChallenge27Stats() {
      var map = window.APP_STATE.student.challenge27 || {};
      var keys = Object.keys(map);
      var completed = keys.length;
      var correct = 0;
      for (var i = 0; i < keys.length; i++) {
        if (map[keys[i]] && map[keys[i]].isCorrect) correct++;
      }
      return { completed: completed, correct: correct, total: 6 };
    }

    /* =========================
       상단 UI 렌더링
       ========================= */
    function renderHeaderAndNav() {
      var st = window.APP_STATE;
      var btnT = document.getElementById('btnModeTeacher');
      var btnS = document.getElementById('btnModeStudent');
      if (btnT && btnS) {
        btnT.setAttribute('aria-pressed', st.mode === 'teacher' ? 'true' : 'false');
        btnS.setAttribute('aria-pressed', st.mode === 'student' ? 'true' : 'false');
      }

      var counter = document.getElementById('slideCounter');
      if (counter) {
        counter.textContent = st.currentSlideId + ' / ' + window.SLIDES.length + '장';
      }

      var activePeriod = getPeriodForSlide(st.currentSlideId);
      var pTabs = document.getElementById('periodTabs');
      if (pTabs) {
        pTabs.innerHTML = window.APP_CONFIG.periods.map(function (p) {
          var active = p.id === activePeriod.id ? ' is-active' : '';
          return '<button type="button" class="period-btn' + active + '" data-jump-slide="' + p.start + '">' +
            escapeHtml(p.shortLabel) + ' (' + p.start + '~' + p.end + '장)</button>';
        }).join('');
      }

      var pills = document.getElementById('slidePills');
      if (pills) {
        var html = '';
        for (var n = activePeriod.start; n <= activePeriod.end; n++) {
          var sl = getSlideById(n);
          if (!sl) continue;
          var cls = n === st.currentSlideId ? ' is-active' : '';
          html += '<button type="button" class="slide-pill' + cls + '" data-jump-slide="' + n + '" aria-label="' + n + '장 ' + escapeHtml(sl.title) + '">' + n + '장</button>';
        }
        pills.innerHTML = html;
      }
    }

    /* =========================
       태스크별 렌더러
       ========================= */
    function renderChoiceTask(task) {
      var mode = window.APP_STATE.mode;
      var isRevealed = !!window.APP_STATE.revealedTasks[task.id];
      var html = '';

      if (task.flowBadges && task.flowBadges.length) {
        html += '<div class="flow-card-strip">' + task.flowBadges.map(function (b, idx) {
          return (idx > 0 ? '<span aria-hidden="true">→</span>' : '') + '<span class="flow-pill">' + escapeHtml(b) + '</span>';
        }).join('') + '</div>';
      }

      html += '<p class="task-prompt">' + escapeHtml(task.prompt) + '</p>';

      if (mode === 'teacher') {
        html += '<div class="choice-grid ' + (task.options.length === 3 ? 'cols-3' : 'cols-2') + '">';
        task.options.forEach(function (opt, idx) {
          var mark = isRevealed && idx === task.answerIndex ? ' is-correct' : '';
          html += '<div class="choice-btn' + mark + '" role="presentation">' +
            '<span class="choice-num">' + (idx + 1) + '</span>' +
            '<span class="choice-text">' + escapeHtml(opt) + '</span></div>';
        });
        html += '</div>';

        html += '<div class="action-bar">' +
          '<button type="button" class="btn btn-primary" data-toggle-reveal="' + task.id + '">' +
          (isRevealed ? '정답 숨기기' : '정답 보기') + '</button></div>';

        if (isRevealed) {
          html += '<div class="feedback-box feedback-ok">' +
            '<p><span class="status-pill">[정답]</span>' + escapeHtml(task.options[task.answerIndex]) + '</p>' +
            '<p>' + escapeHtml(task.reason) + '</p></div>';
        }
        return html;
      }

      // 학생 모드
      var cState = ensureChoiceState(task);
      html += '<div class="choice-grid ' + (task.options.length === 3 ? 'cols-3' : 'cols-2') + '">';
      task.options.forEach(function (opt, idx) {
        var cls = 'choice-btn';
        if (cState.selectedIndex === idx) {
          if (cState.checked === 'correct') cls += ' is-correct';
          else if (cState.checked === 'wrong') cls += ' is-wrong';
          else cls += ' is-selected';
        }
        html += '<button type="button" class="' + cls + '" data-choice-task="' + task.id + '" data-choice-index="' + idx + '">' +
          '<span class="choice-num">' + (idx + 1) + '</span>' +
          '<span class="choice-text">' + escapeHtml(opt) + '</span></button>';
      });
      html += '</div>';

      if (cState.checked === 'correct') {
        html += '<div class="feedback-box feedback-ok">' +
          '<p><span class="status-pill">[정답]</span>정확합니다!</p>' +
          '<p>' + escapeHtml(task.reason) + '</p></div>';
      } else if (cState.checked === 'wrong') {
        html += '<div class="feedback-box feedback-err">' +
          '<p><span class="status-pill">[오답]</span>선택한 답을 다시 확인해 보세요.</p>' +
          '<p>힌트: ' + escapeHtml(task.hint || '거래의 주체와 자산·부채의 변동을 먼저 따져 보세요.') + '</p>' +
          '<div class="action-bar">' +
          '<button type="button" class="btn btn-secondary" data-show-explain="' + task.id + '" data-explain-kind="choice">' +
          (cState.showExplain ? '해설 숨기기' : '해설 보기') + '</button></div>';
        if (cState.showExplain) {
          html += '<div class="feedback-box feedback-info">' +
            '<p><strong>정답:</strong> ' + escapeHtml(task.options[task.answerIndex]) + '</p>' +
            '<p>' + escapeHtml(task.reason) + '</p></div>';
        }
        html += '</div>';
      }
      return html;
    }

            html += '<button type="button" class="chip-btn' + (isSelected ? ' is-selected' : '') + '"' +

            '</button>';

        html += '</div></div>';

        html += '<div class="drop-buckets cols-2">';
        task.slots.forEach(function (sl) {

          html += '<div class="feedback-box feedback-warn"><p><span class="status-pill">[미완성]</span>' + escapeHtml(st.checked.message) + '</p></div>';
        } else if (st.checked.status === 'correct') {
          html += '<div class="feedback-box feedback-ok"><p><span class="status-pill">[정답]</span>모든 항목을 정확하게 분류했습니다!</p>' +
            (task.reason ? '<p>' + escapeHtml(task.reason) + '</p>' : '') + '</div>';

            html += '</ul>' + (task.reason ? '<p>' + escapeHtml(task.reason) + '</p>' : '') + '</div>';
          }
          html += '</div>';
        }
      }
      return html;
    }

        } else {
          html += '<div class="feedback-box feedback-err"><p><span class="status-pill">[오답]</span>' + escapeHtml(st.checked.message) + '</p>' +

            '<div class="action-bar"><button type="button" class="btn btn-secondary" data-show-explain="' + task.id + '" data-explain-kind="calc">' +
            (st.showExplain ? '해설 숨기기' : '해설 보기') + '</button></div>';
          if (st.showExplain) {

        }

        html += '<div class="action-bar">' +
          '<button type="button" class="btn btn-primary" data-toggle-reveal="' + task.id + '">' +
          (isRevealed ? '정답 숨기기' : '정답 보기') + '</button></div>';

        if (isRevealed) {
          html += formatJournalOneLineHtml(task.answer);
          html += '<div class="feedback-box feedback-ok"><p><span class="status-pill">[이유]</span>' + escapeHtml(task.reason) + '</p></div>';
        }
        return html;
      }

      // 학생 모드
      var st = ensureJournalState(task);
      var sel = window.APP_STATE.selectedChip;
      var isSelForTask = sel && sel.taskId === task.id && sel.kind === 'journal';

      if (task.chips && task.chips.length) {
        html += '<div class="chip-bank-wrap">' +
          '<p class="chip-bank-help">계정 칩을 끌어 넣거나 <strong>칩 탭 → 계정 칸 탭</strong>으로 넣을 수 있고, 직접 입력도 가능합니다.</p>' +
          '<div class="chip-bank">';
        task.chips.forEach(function (ch) {
          var isSelected = isSelForTask && sel.value === ch;
          html += '<button type="button" class="chip-btn' + (isSelected ? ' is-selected' : '') + '"' +
            ' data-chip-kind="journal" data-task-id="' + task.id + '" data-chip-value="' + escapeHtml(ch) + '" data-chip-label="' + escapeHtml(ch) + '"' +
            ' aria-pressed="' + (isSelected ? 'true' : 'false') + '">' +
            '<span class="chip-drag-handle" aria-hidden="true">⋮⋮</span>' +
            '<span>' + escapeHtml(ch) + '</span>' +
            (isSelected ? '<span class="chip-selected-tag">선택됨</span>' : '') +
            '</button>';
        });
        html += '</div></div>';
      }

      html += '<div class="journal-editor">';
      // 차변
      html += '<div class="journal-side-box"><span class="board-side-title side-debit">(차) 차변</span>';
      st.debit.forEach(function (row, idx) {
        html += '<div class="journal-row">' +
          '<div class="input-wrap">' +
          '<input type="text" class="text-input' + (isSelForTask ? ' is-drop-ready' : '') + '"' +
          ' data-journal-input="' + task.id + '" data-side="debit" data-row="' + idx + '" data-part="account"' +
          ' data-drop-target="journal-acc" data-task-id="' + task.id + '"' +
          ' value="' + escapeHtml(row.account) + '" placeholder="차변 계정과목" aria-label="차변 ' + (idx + 1) + ' 계정과목">' +
          (row.account ? '<button type="button" class="input-clear-btn" data-clear-journal="' + task.id + '" data-side="debit" data-row="' + idx + '" aria-label="계정 지우기">×</button>' : '') +
          '</div>' +
          '<input type="text" inputmode="numeric" class="text-input amount-input"' +
          ' data-journal-input="' + task.id + '" data-side="debit" data-row="' + idx + '" data-part="amount"' +
          ' value="' + escapeHtml(row.amount) + '" placeholder="금액(원)" aria-label="차변 ' + (idx + 1) + ' 금액">' +
          '</div>';
      });
      html += '</div>';

      // 대변
      html += '<div class="journal-side-box"><span class="board-side-title side-credit">(대) 대변</span>';
      st.credit.forEach(function (row, idx) {
        html += '<div class="journal-row">' +
          '<div class="input-wrap">' +
          '<input type="text" class="text-input' + (isSelForTask ? ' is-drop-ready' : '') + '"' +
          ' data-journal-input="' + task.id + '" data-side="credit" data-row="' + idx + '" data-part="account"' +
          ' data-drop-target="journal-acc" data-task-id="' + task.id + '"' +
          ' value="' + escapeHtml(row.account) + '" placeholder="대변 계정과목" aria-label="대변 ' + (idx + 1) + ' 계정과목">' +
          (row.account ? '<button type="button" class="input-clear-btn" data-clear-journal="' + task.id + '" data-side="credit" data-row="' + idx + '" aria-label="계정 지우기">×</button>' : '') +
          '</div>' +
          '<input type="text" inputmode="numeric" class="text-input amount-input"' +
          ' data-journal-input="' + task.id + '" data-side="credit" data-row="' + idx + '" data-part="amount"' +
          ' value="' + escapeHtml(row.amount) + '" placeholder="금액(원)" aria-label="대변 ' + (idx + 1) + ' 금액">' +
          '</div>';
      });
      html += '</div></div>';

      html += '<div class="action-bar">' +
        '<button type="button" class="btn btn-primary" data-grade-journal="' + task.id + '">채점하기</button>' +
        '<button type="button" class="btn btn-secondary" data-reset-journal="' + task.id + '">입력 지우기</button>' +
        '</div>';

      if (st.checked) {
        if (st.checked.status === 'incomplete') {
          html += '<div class="feedback-box feedback-warn"><p><span class="status-pill">[미완성]</span>' + escapeHtml(st.checked.message) + '</p></div>';
        } else if (st.checked.status === 'correct') {
          html += '<div class="feedback-box feedback-ok">' +
            '<p><span class="status-pill">[정답]</span>분개가 정확합니다!</p>' +
            formatJournalOneLineHtml(task.answer) +
            '<p>' + escapeHtml(task.reason) + '</p></div>';
        } else {
          html += '<div class="feedback-box feedback-err">' +
            '<p><span class="status-pill">[오답]</span>' + escapeHtml(st.checked.message) + '</p>' +
            '<p>힌트: ' + escapeHtml(task.hint || '거래에서 늘어난 항목과 줄어든 항목을 각각 차변과 대변에 적어 보세요.') + '</p>' +
            '<div class="action-bar"><button type="button" class="btn btn-secondary" data-show-explain="' + task.id + '" data-explain-kind="journal">' +
            (st.showExplain ? '해설 숨기기' : '해설 보기') + '</button></div>';
          if (st.showExplain) {
            html += '<div class="feedback-box feedback-info">' +
              formatJournalOneLineHtml(task.answer) +
              '<p>' + escapeHtml(task.reason) + '</p></div>';
          }
          html += '</div>';
        }
      }
      return html;
    }

    /* 총계정원장 T형 표 렌더러 (14장, 18장) */
    function renderTAccountTable(accountTitle, leftRows, rightRows, hideMask) {
      var maxLen = Math.max(leftRows.length, rightRows.length, 2);
      var html = '<div class="t-account-wrap">' +
        '<div class="t-account-title">' + escapeHtml(accountTitle) + '</div>' +
        '<table class="t-account-table">' +
        '<colgroup><col style="width:12%"><col style="width:22%"><col style="width:16%">' +
        '<col style="width:12%"><col style="width:22%"><col style="width:16%"></colgroup>' +
        '<thead><tr>' +
        '<th>일자</th><th>적요</th><th class="t-center-divider">금액</th>' +
        '<th>일자</th><th>적요</th><th>금액</th>' +
        '</tr></thead><tbody>';

      for (var i = 0; i < maxLen; i++) {
        var l = leftRows[i] || null;
        var r = rightRows[i] || null;
        var hideL = hideMask && l && l.hiddenInBlank;
        var hideR = hideMask && r && r.hiddenInBlank;
        html += '<tr>' +
          '<td>' + (l && !hideL ? escapeHtml(l.date) : '&nbsp;') + '</td>' +
          '<td>' + (l && !hideL ? escapeHtml(l.summary) : (hideL ? '<span style="color:var(--ink-muted)">(판서 칸)</span>' : '&nbsp;')) + '</td>' +
          '<td class="num t-center-divider">' + (l && !hideL ? formatWon(l.amount) : '&nbsp;') + '</td>' +
          '<td>' + (r && !hideR ? escapeHtml(r.date) : '&nbsp;') + '</td>' +
          '<td>' + (r && !hideR ? escapeHtml(r.summary) : (hideR ? '<span style="color:var(--ink-muted)">(판서 칸)</span>' : '&nbsp;')) + '</td>' +
          '<td class="num">' + (r && !hideR ? formatWon(r.amount) : '&nbsp;') + '</td>' +
          '</tr>';
      }
      html += '</tbody></table></div>';
      return html;
    }

    function renderLedgerTask(task) {
      var mode = window.APP_STATE.mode;
      var isRevealed = !!window.APP_STATE.revealedTasks[task.id];
      var html = '<p class="task-prompt">' + escapeHtml(task.prompt) + '</p>';

      if (mode === 'teacher') {
        task.accounts.forEach(function (acc) {
          html += renderTAccountTable(acc.title, acc.leftRows, acc.rightRows, !isRevealed);
          if (isRevealed && acc.balanceText) {
            html += '<div style="font-size:var(--font-small); font-weight:800; color:var(--primary); margin:-4px 0 12px;">' + escapeHtml(acc.balanceText) + '</div>';
          }
        });
        html += '<div class="action-bar">' +
          '<button type="button" class="btn btn-primary" data-toggle-reveal="' + task.id + '">' +
          (isRevealed ? '정답 숨기기' : '정답 보기') + '</button></div>';
        if (isRevealed) {
          html += '<div class="feedback-box feedback-ok"><p><span class="status-pill">[정답]</span>' + escapeHtml(task.reason) + '</p></div>';
        }
        return html;
      }

      // 학생 모드
      var st = ensureLedgerState(task);
      var showFilled = st.checked && st.checked.status === 'correct';
      task.accounts.forEach(function (acc) {
        html += renderTAccountTable(acc.title, acc.leftRows, acc.rightRows, !showFilled);
      });

      html += '<div class="calc-grid cols-2">';
      task.fields.forEach(function (f) {
        var val = st.values[f.key] != null ? st.values[f.key] : '';
        html += '<div class="calc-field"><label for="led-' + task.id + '-' + f.key + '">' + escapeHtml(f.label) + '</label>';
        if (f.kind === 'select') {
          html += '<div class="seg-group">';
          f.options.forEach(function (opt) {
            var selCls = val === opt ? ' is-selected' : '';
            html += '<button type="button" class="seg-btn' + selCls + '" data-ledger-seg="' + task.id + '" data-field-key="' + f.key + '" data-seg-val="' + escapeHtml(opt) + '">' + escapeHtml(opt) + '</button>';
          });
          html += '</div>';
        } else {
          html += '<input type="text" inputmode="numeric" class="text-input amount-input" id="led-' + task.id + '-' + f.key + '"' +
            ' data-ledger-input="' + task.id + '" data-field-key="' + f.key + '"' +
            ' value="' + escapeHtml(val) + '" placeholder="' + escapeHtml(f.placeholder || '금액 입력(원)') + '">';
        }
        html += '</div>';
      });
      html += '</div>';

      html += '<div class="action-bar"><button type="button" class="btn btn-primary" data-grade-ledger="' + task.id + '">전기 채점하기</button></div>';

      if (st.checked) {
        if (st.checked.status === 'incomplete') {
          html += '<div class="feedback-box feedback-warn"><p><span class="status-pill">[미완성]</span>' + escapeHtml(st.checked.message) + '</p></div>';
        } else if (st.checked.status === 'correct') {
          html += '<div class="feedback-box feedback-ok"><p><span class="status-pill">[정답]</span>총계정원장 전기를 정확하게 마쳤습니다!</p><p>' + escapeHtml(task.reason) + '</p></div>';
        } else {
          html += '<div class="feedback-box feedback-err"><p><span class="status-pill">[오답]</span>' + escapeHtml(st.checked.message) + '</p>' +
            '<p>힌트: ' + escapeHtml(task.hint || '분개에서 해당 계정이 차변(왼쪽)인지 대변(오른쪽)인지 그대로 옮겨 적습니다.') + '</p>' +
            '<div class="action-bar"><button type="button" class="btn btn-secondary" data-show-explain="' + task.id + '" data-explain-kind="ledger">' +
            (st.showExplain ? '해설 숨기기' : '해설 보기') + '</button></div>';
          if (st.showExplain) {
            var ansSummary = task.fields.map(function (f) {
              var disp = f.kind === 'number' ? formatWon(f.answer) + '원' : f.answer;
              return f.label + ': ' + disp;
            }).join(' / ');
            html += '<div class="feedback-box feedback-info"><p><strong>정답:</strong> ' + escapeHtml(ansSummary) + '</p><p>' + escapeHtml(task.reason) + '</p></div>';
          }
          html += '</div>';
        }
      }
      return html;
    }

    function renderTaskWrapper(task, isAccordion) {
      var body = '';
      if (task.type === 'choice') body = renderChoiceTask(task);
      else if (task.type === 'classify') body = renderClassifyTask(task);
      else if (task.type === 'calc') body = renderCalcTask(task);
      else if (task.type === 'journal') body = renderJournalTask(task);
      else if (task.type === 'ledger') body = renderLedgerTask(task);

      if (isAccordion) {
        return '<details class="task-details" open>' +
          '<summary><span>' + escapeHtml(task.title) + '</span><span style="font-size:var(--font-small); color:var(--primary);">펼치기 / 접기</span></summary>' +
          '<div class="task-details-body">' + body + '</div></details>';
      }

      return '<section class="task-card" aria-label="' + escapeHtml(task.title) + '">' +
        '<div class="task-header"><h3 class="task-label">' + escapeHtml(task.title) + '</h3></div>' +
        body + '</section>';
    }

        '<thead><tr><th style="width:22%;">개념</th><th>기억할 핵심 질문</th><th style="width:18%;">예제 장 이동</th></tr></thead><tbody>';
      (slide.checklist || []).forEach(function (row) {
        html += '<tr><td><strong>' + escapeHtml(row.name) + '</strong></td>' +
          '<td>' + escapeHtml(row.question) + '</td>' +
          '<td><button type="button" class="btn btn-secondary" style="padding:6px 12px; min-height:38px;" data-jump-slide="' + row.jump + '">' + escapeHtml(row.label) + '</button></td></tr>';

      if (stats.completed > 0) {
