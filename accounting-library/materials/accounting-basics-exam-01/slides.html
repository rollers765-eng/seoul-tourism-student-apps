          for (var i = 0; i < task.answer.debit.length; i++) {
            html += '<div class="board-write-row"><div class="board-cell">계정과목</div><div class="board-cell">금액(원)</div></div>';
          }
          html += '</div>';
          html += '<div class="board-side"><span class="board-side-title side-credit">(대) 대변</span>';
          for (var j = 0; j < task.answer.credit.length; j++) {
            html += '<div class="board-write-row"><div class="board-cell">계정과목</div><div class="board-cell">금액(원)</div></div>';
          }
          html += '</div></div></div>';
        }

        html += '<div class="action-bar">' +
          '<button type="button" class="btn btn-primary" data-toggle-reveal="' + task.id + '">' +
          (isRevealed ? '정답 숨기기' : '정답 보기') + '</button></div>';

        if (isRevealed) {
          html += formatJournalOneLineHtml(task.answer);
          html += '<div class="feedback-box feedback-ok"><p><span class="status-pill">[이유]</span>' + escapeHtml(task.reason) + '</p></div>';
        }
        return html;
      }

      // 학생 모드
      var st = ensureJournalState(task);
      var sel = window.APP_STATE.selectedChip;
      var isSelForTask = sel && sel.taskId === task.id && sel.kind === 'journal';

      if (task.chips && task.chips.length) {
        html += '<div class="chip-bank-wrap">' +
          '<p class="chip-bank-help">계정 칩을 끌어 넣거나 <strong>칩 탭 → 계정 칸 탭</strong>으로 넣을 수 있고, 직접 입력도 가능합니다.</p>' +
          '<div class="chip-bank">';
        task.chips.forEach(function (ch) {
          var isSelected = isSelForTask && sel.value === ch;
          html += '<button type="button" class="chip-btn' + (isSelected ? ' is-selected' : '') + '"' +
            ' data-chip-kind="journal" data-task-id="' + task.id + '" data-chip-value="' + escapeHtml(ch) + '" data-chip-label="' + escapeHtml(ch) + '"' +
            ' aria-pressed="' + (isSelected ? 'true' : 'false') + '">' +
            '<span class="chip-drag-handle" aria-hidden="true">⋮⋮</span>' +
            '<span>' + escapeHtml(ch) + '</span>' +
            (isSelected ? '<span class="chip-selected-tag">선택됨</span>' : '') +
            '</button>';
        });
        html += '</div></div>';
      }

      html += '<div class="journal-editor">';
      // 차변
      html += '<div class="journal-side-box"><span class="board-side-title side-debit">(차) 차변</span>';
      st.debit.forEach(function (row, idx) {
        html += '<div class="journal-row">' +
          '<div class="input-wrap">' +
          '<input type="text" class="text-input' + (isSelForTask ? ' is-drop-ready' : '') + '"' +
          ' data-journal-input="' + task.id + '" data-side="debit" data-row="' + idx + '" data-part="account"' +
          ' data-drop-target="journal-acc" data-task-id="' + task.id + '"' +
          ' value="' + escapeHtml(row.account) + '" placeholder="차변 계정과목" aria-label="차변 ' + (idx + 1) + ' 계정과목">' +
          (row.account ? '<button type="button" class="input-clear-btn" data-clear-journal="' + task.id + '" data-side="debit" data-row="' + idx + '" aria-label="계정 지우기">×</button>' : '') +
          '</div>' +
          '<input type="text" inputmode="numeric" class="text-input amount-input"' +
          ' data-journal-input="' + task.id + '" data-side="debit" data-row="' + idx + '" data-part="amount"' +
          ' value="' + escapeHtml(row.amount) + '" placeholder="금액(원)" aria-label="차변 ' + (idx + 1) + ' 금액">' +
          '</div>';
      });
      html += '</div>';

      // 대변
      html += '<div class="journal-side-box"><span class="board-side-title side-credit">(대) 대변</span>';
      st.credit.forEach(function (row, idx) {
        html += '<div class="journal-row">' +
          '<div class="input-wrap">' +
          '<input type="text" class="text-input' + (isSelForTask ? ' is-drop-ready' : '') + '"' +
          ' data-journal-input="' + task.id + '" data-side="credit" data-row="' + idx + '" data-part="account"' +
          ' data-drop-target="journal-acc" data-task-id="' + task.id + '"' +
          ' value="' + escapeHtml(row.account) + '" placeholder="대변 계정과목" aria-label="대변 ' + (idx + 1) + ' 계정과목">' +
          (row.account ? '<button type="button" class="input-clear-btn" data-clear-journal="' + task.id + '" data-side="credit" data-row="' + idx + '" aria-label="계정 지우기">×</button>' : '') +
          '</div>' +
          '<input type="text" inputmode="numeric" class="text-input amount-input"' +
          ' data-journal-input="' + task.id + '" data-side="credit" data-row="' + idx + '" data-part="amount"' +
          ' value="' + escapeHtml(row.amount) + '" placeholder="금액(원)" aria-label="대변 ' + (idx + 1) + ' 금액">' +
          '</div>';
      });
      html += '</div></div>';

      html += '<div class="action-bar">' +
        '<button type="button" class="btn btn-primary" data-grade-journal="' + task.id + '">채점하기</button>' +
        '<button type="button" class="btn btn-secondary" data-reset-journal="' + task.id + '">입력 지우기</button>' +
        '</div>';

      if (st.checked) {
        if (st.checked.status === 'incomplete') {
          html += '<div class="feedback-box feedback-warn"><p><span class="status-pill">[미완성]</span>' + escapeHtml(st.checked.message) + '</p></div>';
        } else if (st.checked.status === 'correct') {
          html += '<div class="feedback-box feedback-ok">' +
            '<p><span class="status-pill">[정답]</span>분개가 정확합니다!</p>' +
            formatJournalOneLineHtml(task.answer) +
            '<p>' + escapeHtml(task.reason) + '</p></div>';
        } else {
          html += '<div class="feedback-box feedback-err">' +
            '<p><span class="status-pill">[오답]</span>' + escapeHtml(st.checked.message) + '</p>' +
            '<p>힌트: ' + escapeHtml(task.hint || '거래에서 늘어난 항목과 줄어든 항목을 각각 차변과 대변에 적어 보세요.') + '</p>' +
            '<div class="action-bar"><button type="button" class="btn btn-secondary" data-show-explain="' + task.id + '" data-explain-kind="journal">' +
            (st.showExplain ? '해설 숨기기' : '해설 보기') + '</button></div>';
          if (st.showExplain) {
            html += '<div class="feedback-box feedback-info">' +
              formatJournalOneLineHtml(task.answer) +
              '<p>' + escapeHtml(task.reason) + '</p></div>';
          }
          html += '</div>';
        }
      }
      return html;
    }

    /* 총계정원장 T형 표 렌더러 (14장, 18장) */
    function renderTAccountTable(accountTitle, leftRows, rightRows, hideMask) {
      var maxLen = Math.max(leftRows.length, rightRows.length, 2);
      var html = '<div class="t-account-wrap">' +
        '<div class="t-account-title">' + escapeHtml(accountTitle) + '</div>' +
        '<table class="t-account-table">' +
        '<colgroup><col style="width:12%"><col style="width:22%"><col style="width:16%">' +
        '<col style="width:12%"><col style="width:22%"><col style="width:16%"></colgroup>' +
        '<thead><tr>' +
        '<th>일자</th><th>적요</th><th class="t-center-divider">금액</th>' +
        '<th>일자</th><th>적요</th><th>금액</th>' +
        '</tr></thead><tbody>';

      for (var i = 0; i < maxLen; i++) {
        var l = leftRows[i] || null;
        var r = rightRows[i] || null;
        var hideL = hideMask && l && l.hiddenInBlank;
        var hideR = hideMask && r && r.hiddenInBlank;
        html += '<tr>' +
          '<td>' + (l && !hideL ? escapeHtml(l.date) : '&nbsp;') + '</td>' +
          '<td>' + (l && !hideL ? escapeHtml(l.summary) : (hideL ? '<span style="color:var(--ink-muted)">(판서 칸)</span>' : '&nbsp;')) + '</td>' +
          '<td class="num t-center-divider">' + (l && !hideL ? formatWon(l.amount) : '&nbsp;') + '</td>' +
          '<td>' + (r && !hideR ? escapeHtml(r.date) : '&nbsp;') + '</td>' +
          '<td>' + (r && !hideR ? escapeHtml(r.summary) : (hideR ? '<span style="color:var(--ink-muted)">(판서 칸)</span>' : '&nbsp;')) + '</td>' +
          '<td class="num">' + (r && !hideR ? formatWon(r.amount) : '&nbsp;') + '</td>' +
          '</tr>';
      }
      html += '</tbody></table></div>';
      return html;
    }

    function renderLedgerTask(task) {
      var mode = window.APP_STATE.mode;
      var isRevealed = !!window.APP_STATE.revealedTasks[task.id];
      var html = '<p class="task-prompt">' + escapeHtml(task.prompt) + '</p>';

      if (mode === 'teacher') {
        task.accounts.forEach(function (acc) {
          html += renderTAccountTable(acc.title, acc.leftRows, acc.rightRows, !isRevealed);
          if (isRevealed && acc.balanceText) {
            html += '<div style="font-size:var(--font-small); font-weight:800; color:var(--primary); margin:-4px 0 12px;">' + escapeHtml(acc.balanceText) + '</div>';
          }
        });
        html += '<div class="action-bar">' +
          '<button type="button" class="btn btn-primary" data-toggle-reveal="' + task.id + '">' +
          (isRevealed ? '정답 숨기기' : '정답 보기') + '</button></div>';
        if (isRevealed) {
          html += '<div class="feedback-box feedback-ok"><p><span class="status-pill">[정답]</span>' + escapeHtml(task.reason) + '</p></div>';
        }
        return html;
      }

      // 학생 모드
      var st = ensureLedgerState(task);
      var showFilled = st.checked && st.checked.status === 'correct';
      task.accounts.forEach(function (acc) {
        html += renderTAccountTable(acc.title, acc.leftRows, acc.rightRows, !showFilled);
      });

      html += '<div class="calc-grid cols-2">';
      task.fields.forEach(function (f) {
        var val = st.values[f.key] != null ? st.values[f.key] : '';
        html += '<div class="calc-field"><label for="led-' + task.id + '-' + f.key + '">' + escapeHtml(f.label) + '</label>';
        if (f.kind === 'select') {
          html += '<div class="seg-group">';
          f.options.forEach(function (opt) {
            var selCls = val === opt ? ' is-selected' : '';
            html += '<button type="button" class="seg-btn' + selCls + '" data-ledger-seg="' + task.id + '" data-field-key="' + f.key + '" data-seg-val="' + escapeHtml(opt) + '">' + escapeHtml(opt) + '</button>';
          });
          html += '</div>';
        } else {
          html += '<input type="text" inputmode="numeric" class="text-input amount-input" id="led-' + task.id + '-' + f.key + '"' +
            ' data-ledger-input="' + task.id + '" data-field-key="' + f.key + '"' +
            ' value="' + escapeHtml(val) + '" placeholder="' + escapeHtml(f.placeholder || '금액 입력(원)') + '">';
        }
        html += '</div>';
      });
      html += '</div>';

      html += '<div class="action-bar"><button type="button" class="btn btn-primary" data-grade-ledger="' + task.id + '">전기 채점하기</button></div>';

      if (st.checked) {
        if (st.checked.status === 'incomplete') {
          html += '<div class="feedback-box feedback-warn"><p><span class="status-pill">[미완성]</span>' + escapeHtml(st.checked.message) + '</p></div>';
        } else if (st.checked.status === 'correct') {
          html += '<div class="feedback-box feedback-ok"><p><span class="status-pill">[정답]</span>총계정원장 전기를 정확하게 마쳤습니다!</p><p>' + escapeHtml(task.reason) + '</p></div>';
        } else {
          html += '<div class="feedback-box feedback-err"><p><span class="status-pill">[오답]</span>' + escapeHtml(st.checked.message) + '</p>' +
            '<p>힌트: ' + escapeHtml(task.hint || '분개에서 해당 계정이 차변(왼쪽)인지 대변(오른쪽)인지 그대로 옮겨 적습니다.') + '</p>' +
            '<div class="action-bar"><button type="button" class="btn btn-secondary" data-show-explain="' + task.id + '" data-explain-kind="ledger">' +
            (st.showExplain ? '해설 숨기기' : '해설 보기') + '</button></div>';
          if (st.showExplain) {
            var ansSummary = task.fields.map(function (f) {
              var disp = f.kind === 'number' ? formatWon(f.answer) + '원' : f.answer;
              return f.label + ': ' + disp;
            }).join(' / ');
            html += '<div class="feedback-box feedback-info"><p><strong>정답:</strong> ' + escapeHtml(ansSummary) + '</p><p>' + escapeHtml(task.reason) + '</p></div>';
          }
          html += '</div>';
        }
      }
      return html;
    }

    function renderTaskWrapper(task, isAccordion) {
      var body = '';
      if (task.type === 'choice') body = renderChoiceTask(task);
      else if (task.type === 'classify') body = renderClassifyTask(task);
      else if (task.type === 'calc') body = renderCalcTask(task);
      else if (task.type === 'journal') body = renderJournalTask(task);
      else if (task.type === 'ledger') body = renderLedgerTask(task);

      if (isAccordion) {
        return '<details class="task-details" open>' +
          '<summary><span>' + escapeHtml(task.title) + '</span><span style="font-size:var(--font-small); color:var(--primary);">펼치기 / 접기</span></summary>' +
          '<div class="task-details-body">' + body + '</div></details>';
      }

      return '<section class="task-card" aria-label="' + escapeHtml(task.title) + '">' +
        '<div class="task-header"><h3 class="task-label">' + escapeHtml(task.title) + '</h3></div>' +
        body + '</section>';
    }

    /* =========================
       특수 슬라이드 렌더러 (표지·마감)
       ========================= */
    function renderCoverSlide(slide) {
      var html = '<section class="cover-hero">' +
        '<div class="slide-meta-row"><span class="badge badge-period">' + escapeHtml(window.APP_CONFIG.coverBadges[0]) + '</span><span class="badge badge-concept">' + escapeHtml(window.APP_CONFIG.coverBadges[1]) + '</span></div>' +
        '<h1 class="slide-title">' + escapeHtml(slide.title) + '</h1>' +
        '<p class="concept-note">' + escapeHtml(slide.concept) + '</p>' +
        '<div class="svg-frame" style="margin:14px 0;">' + slide.diagramHtml + '</div>' +
        '<div class="story-box"><p><span class="story-tag">이용 안내</span>' + escapeHtml(slide.guideText) + '</p></div>' +
        '<div class="cover-periods">';
      window.APP_CONFIG.periods.forEach(function (p) {
        html += '<button type="button" class="period-card-btn" data-jump-slide="' + p.start + '">' +
          '<span class="period-card-tag">' + escapeHtml(p.shortLabel) + ' · ' + p.start + '~' + p.end + '장</span>' +
          '<span class="period-card-title">' + escapeHtml(p.label.replace(/^\d차시 · /, '')) + '</span>' +
          '<span class="period-card-desc">' + escapeHtml(p.desc) + '</span></button>';
      });
      html += '</div></section>';
      return html;
    }

    function renderSummarySlide(slide) {
      var stats = getChallenge27Stats();
      var html = '<section class="top-banner">' +
        '<div class="slide-meta-row"><span class="badge badge-period">' + escapeHtml(window.APP_CONFIG.summaryBadges[0]) + '</span><span class="badge badge-concept">' + escapeHtml(window.APP_CONFIG.summaryBadges[1]) + '</span></div>' +
        '<h1 class="slide-title">' + escapeHtml(slide.title) + '</h1>' +
        '<p class="concept-note">' + escapeHtml(slide.concept) + '</p>';

      if (stats.completed > 0) {
        html += '<div class="challenge-bar" style="margin-top:12px;">' +
          '<span>' + escapeHtml(window.APP_CONFIG.challengeLabel) + ' 연습 결과: 완료 ' + stats.completed + ' / ' + stats.total + '문항 · 맞힌 문항 ' + stats.correct + '문항</span>' +
          '<button type="button" class="btn btn-primary" data-reset-challenge="1">' + escapeHtml(window.APP_CONFIG.challengeLabel) + ' 다시 풀기</button>' +
          '</div>';
      } else {
        html += '<div class="action-bar">' +
          '<button type="button" class="btn btn-primary" data-jump-slide="' + window.APP_CONFIG.challengeSlideId + '">' + escapeHtml(window.APP_CONFIG.challengeLabel) + ' 점검 풀러 가기</button>' +
          '</div>';
      }
      html += '</section>';

      html += '<section class="panel-card"><h2 class="panel-title">' + escapeHtml(window.APP_CONFIG.summaryTableTitle) + '</h2>' +
        '<div class="info-table-wrap"><table class="info-table">' +
        '<thead><tr><th style="width:22%;">개념</th><th>기억할 핵심 질문</th><th style="width:18%;">예제 장 이동</th></tr></thead><tbody>';
      (slide.checklist || []).forEach(function (row) {
        html += '<tr><td><strong>' + escapeHtml(row.name) + '</strong></td>' +
          '<td>' + escapeHtml(row.question) + '</td>' +
          '<td><button type="button" class="btn btn-secondary" style="padding:6px 12px; min-height:38px;" data-jump-slide="' + row.jump + '">' + escapeHtml(row.label) + '</button></td></tr>';
      });
      html += '</tbody></table></div>';
      if (stats.completed > 0) {
        html += '<div class="action-bar"><button type="button" class="btn btn-accent" data-reset-challenge="1">' + escapeHtml(window.APP_CONFIG.challengeLabel) + ' 연습 초기화 후 다시 풀기</button></div>';
      }
      html += '</section>';

      if (slide.diagramHtml) {
        html += '<section class="panel-card"><div class="svg-frame">' + slide.diagramHtml + '</div></section>';
      }
      if (slide.sidePanelHtml) {
        html += '<section class="panel-card"><h2 class="panel-title">' + escapeHtml(slide.sidePanelTitle || '복습 안내') + '</h2>' + slide.sidePanelHtml + '</section>';
      }
      return html;
    }

    /* =========================
       메인 슬라이드 전체 렌더링
       ========================= */
    function renderCurrentSlide() {
      var root = document.getElementById('slideRoot');
      if (!root) return;
      var slide = getSlideById(window.APP_STATE.currentSlideId);
      if (!slide) {
        root.innerHTML = '<div class="panel-card"><p>슬라이드 데이터를 불러오는 중입니다.</p></div>';
        return;
      }

      var html = '';
      if (slide.kind === 'cover') {
        html = renderCoverSlide(slide);
      } else if (slide.kind === 'summary') {
        html = renderSummarySlide(slide);
      } else {
        var period = getPeriodForSlide(slide.id);
        html += '<section class="top-banner">' +
          '<div class="slide-meta-row">' +
          '<span class="badge badge-period">' + escapeHtml(period.shortLabel) + ' · ' + slide.id + '장</span>' +
          '<span class="badge badge-concept">' + escapeHtml(slide.conceptTag) + '</span>' +
          '</div>' +
          '<h1 class="slide-title">' + escapeHtml(slide.title) + '</h1>' +
          (slide.concept ? '<p class="concept-note">' + escapeHtml(slide.concept) + '</p>' : '');

        if (slide.story && slide.story.length) {
          html += '<div class="story-box">';
          slide.story.forEach(function (line) {
            html += '<p>' + line + '</p>';
          });
          html += '</div>';
        }
        html += '</section>';

        // 점검·마감 장의 학생 모드 연습 결과 현황판
        if ((slide.id === window.APP_CONFIG.challengeSlideId || slide.id === window.APP_CONFIG.summarySlideId) && window.APP_STATE.mode === 'student') {
          var st27 = getChallenge27Stats();
          html += '<div class="challenge-bar">' +
            '<span>연습 결과 · 완료한 문항: ' + st27.completed + ' / ' + st27.total + ' · 맞힌 문항: ' + st27.correct + '문항</span>' +
            '<button type="button" class="btn btn-secondary" style="min-height:36px; padding:5px 12px;" data-reset-challenge="1">다시 풀기</button>' +
            '</div>';
        }

        // 중간 도식 + 장부/비교 영역
        var hasDiagram = !!slide.diagramHtml;
        var hasLedgerPanel = !!slide.sidePanelHtml;
        if (hasDiagram || hasLedgerPanel) {
          html += '<div class="mid-grid' + (hasDiagram && hasLedgerPanel ? ' is-two-col' : '') + '">';
          if (hasDiagram) {
            html += '<section class="panel-card">' +
              '<h2 class="panel-title">' + escapeHtml(slide.diagramTitle || '거래 흐름 도식') + '</h2>' +
              '<div class="svg-frame">' + slide.diagramHtml + '</div>' +
              (slide.diagramNote ? '<div class="callout-tip">' + escapeHtml(slide.diagramNote) + '</div>' : '') +
              '</section>';
          }
          if (hasLedgerPanel) {
            html += '<section class="panel-card">' +
              '<h2 class="panel-title">' + escapeHtml(slide.sidePanelTitle || '장부 포인트') + '</h2>' +
              slide.sidePanelHtml +
              '</section>';
          }
          html += '</div>';
        }

        // 하단 과제 영역
        if (slide.tasks && slide.tasks.length) {
          html += '<div class="tasks-stack">';
          slide.tasks.forEach(function (t) {
            html += renderTaskWrapper(t, !!slide.accordionTasks);
          });
          html += '</div>';
        }
      }

      // 슬라이드 끝 이전/다음 버튼
      var isFirst = slide.id <= 1;
      var isLast = slide.id >= window.SLIDES.length;
      html += '<nav class="slide-footer-nav" aria-label="이전 및 다음 슬라이드">' +
        '<button type="button" class="btn btn-secondary" data-nav-step="-1"' + (isFirst ? ' disabled' : '') + '>← 이전 장</button>' +
        '<span style="font-size:var(--font-small); font-weight:800; color:var(--ink-muted);">' + slide.id + ' / ' + window.SLIDES.length + '장</span>' +
        '<button type="button" class="btn btn-primary" data-nav-step="1"' + (isLast ? ' disabled' : '') + '>다음 장 →</button>' +
        '</nav>';

      root.innerHTML = html;
    }

    function renderAll() {
      renderHeaderAndNav();
      renderCurrentSlide();
    }

    /* =========================
       태스크 찾기 및 채점 트리거
       ========================= */
    function findTaskById(taskId) {
      for (var i = 0; i < window.SLIDES.length; i++) {
        var tasks = window.SLIDES[i].tasks || [];
        for (var j = 0; j < tasks.length; j++) {
          if (tasks[j].id === taskId) return tasks[j];
        }
      }
      return null;
    }

    function handleGradeClassify(taskId, silentIfIncomplete) {
      var task = findTaskById(taskId);
      if (!task) return;
      var st = ensureClassifyState(task);

      if (task.layout === 'buckets') {
        var missing = task.items.filter(function (it) { return !st.placements[it.id]; });
        if (missing.length > 0) {
          if (silentIfIncomplete) return;
          st.checked = { status: 'incomplete', message: '아직 배치하지 않은 항목이 ' + missing.length + '개 있습니다.' };
          renderCurrentSlide();
          return;
        }
        var wrongItems = task.items.filter(function (it) { return st.placements[it.id] !== it.answer; });
        if (wrongItems.length === 0) {
          st.checked = { status: 'correct', message: '' };
          st.showExplain = false;
        } else {
          st.checked = {
            status: 'wrong',
            message: wrongItems.length + '개 항목의 위치가 다릅니다: ' + wrongItems.map(function (w) { return '「' + w.label + '」'; }).join(', ')
          };
        }
      } else {
        var emptySlots = task.slots.filter(function (sl) { return !st.placements[sl.id]; });
        if (emptySlots.length > 0) {
          if (silentIfIncomplete) return;
          st.checked = { status: 'incomplete', message: '비어 있는 카드가 ' + emptySlots.length + '개 있습니다.' };
          renderCurrentSlide();
          return;
        }
        var wrongSlots = task.slots.filter(function (sl) { return st.placements[sl.id] !== sl.answer; });
        if (wrongSlots.length === 0) {
          st.checked = { status: 'correct', message: '' };
          st.showExplain = false;
        } else {
          st.checked = {
            status: 'wrong',
            message: wrongSlots.length + '개 카드의 계정을 다시 확인해 보세요: ' + wrongSlots.map(function (w) { return w.title || w.prompt.slice(0, 14); }).join(', ')
          };
        }
      }
      renderCurrentSlide();
    }

    function handleGradeCalc(taskId) {
      var task = findTaskById(taskId);
      if (!task) return;
      var st = ensureCalcState(task);
      var emptyLabels = [];
      var wrongLabels = [];

      for (var i = 0; i < task.fields.length; i++) {
        var f = task.fields[i];
        var raw = st.values[f.key];
        if (raw == null || String(raw).trim() === '') {
          emptyLabels.push(f.label);
          continue;
        }
        if (f.kind === 'number') {
          var parsed = parseAmount(raw);
          if (parsed === null || parsed !== f.answer) {
            wrongLabels.push(f.label);
          }
        } else {
          if (String(raw).trim() !== String(f.answer).trim()) {
            wrongLabels.push(f.label);
          }
        }
      }

      if (emptyLabels.length > 0) {
        st.checked = { status: 'incomplete', message: '비어 있는 칸을 채워 주세요: ' + emptyLabels.join(', ') };
      } else if (wrongLabels.length > 0) {
        st.checked = { status: 'wrong', message: '다음 항목을 다시 확인해 보세요: ' + wrongLabels.join(', ') };
      } else {
        st.checked = { status: 'correct', message: '' };
        st.showExplain = false;
      }
      renderCurrentSlide();
    }

    function handleGradeLedger(taskId) {
      var task = findTaskById(taskId);
      if (!task) return;
      var st = ensureLedgerState(task);
      var emptyLabels = [];
      var wrongLabels = [];

      for (var i = 0; i < task.fields.length; i++) {
        var f = task.fields[i];
        var raw = st.values[f.key];
        if (raw == null || String(raw).trim() === '') {
          emptyLabels.push(f.label);
          continue;
        }
        if (f.kind === 'number') {
          var parsed = parseAmount(raw);
          if (parsed === null || parsed !== f.answer) {
            wrongLabels.push(f.label);
          }
        } else {
          if (String(raw).trim() !== String(f.answer).trim()) {
            wrongLabels.push(f.label);
          }
        }
      }

      if (emptyLabels.length > 0) {
        st.checked = { status: 'incomplete', message: '비어 있는 전기 항목을 채워 주세요: ' + emptyLabels.join(', ') };
      } else if (wrongLabels.length > 0) {
        st.checked = { status: 'wrong', message: '다시 확인할 항목: ' + wrongLabels.join(', ') };
      } else {
        st.checked = { status: 'correct', message: '' };
        st.showExplain = false;
      }
      renderCurrentSlide();
    }

    function handleGradeJournal(taskId) {
      var task = findTaskById(taskId);
      if (!task) return;
      var st = ensureJournalState(task);
      st.checked = gradeJournalEntry(task.answer, st.debit, st.credit);
      if (st.checked.status === 'correct') st.showExplain = false;
      renderCurrentSlide();
    }

    function placeChipIntoTarget(taskId, chipKind, chipValue, targetType, targetEl) {
      var task = findTaskById(taskId);
      if (!task) return;

      if (chipKind === 'classify' && task.type === 'classify') {
        var st = ensureClassifyState(task);
        var targetId = targetEl.getAttribute('data-target-id');
        if (targetType === 'bucket') {
          st.placements[chipValue] = targetId;
        } else if (targetType === 'slot') {
          st.placements[targetId] = chipValue;
        }
        st.checked = null;
        window.APP_STATE.selectedChip = null;
        // 모든 빈칸이 채워지면 자동 채점
        renderCurrentSlide();
        handleGradeClassify(taskId, true);
      } else if (chipKind === 'journal' && task.type === 'journal') {
        var jSt = ensureJournalState(task);
        var side = targetEl.getAttribute('data-side');
        var rowIdx = parseInt(targetEl.getAttribute('data-row'), 10);
        if (side && !isNaN(rowIdx) && jSt[side] && jSt[side][rowIdx]) {
          jSt[side][rowIdx].account = chipValue;
          jSt.checked = null;
          window.APP_STATE.selectedChip = null;
          renderCurrentSlide();
        }
      }
    }

    /* =========================
       Pointer Events 드래그 처리
       ========================= */
    function cleanupDrag() {
      var d = window.APP_STATE.drag;
      if (d && d.ghostEl && d.ghostEl.parentNode) {
        d.ghostEl.parentNode.removeChild(d.ghostEl);
      }
      var overs = document.querySelectorAll('.is-drag-over');
      for (var i = 0; i < overs.length; i++) overs[i].classList.remove('is-drag-over');
      window.APP_STATE.drag = null;
    }

    function findDropTargetAt(x, y, dragInfo) {
      var el = document.elementFromPoint(x, y);
      if (!el) return null;
      var target = el.closest('[data-drop-target]');
      if (!target) return null;
      if (target.getAttribute('data-task-id') !== dragInfo.taskId) return null;
      var tType = target.getAttribute('data-drop-target');
      if (dragInfo.kind === 'classify' && (tType === 'bucket' || tType === 'slot')) return target;
      if (dragInfo.kind === 'journal' && tType === 'journal-acc') return target;
      return null;
    }

    /* =========================
       전역 이벤트 위임 바인딩
       ========================= */
    function bindGlobalEvents() {
      document.addEventListener('click', function (e) {
        var btn;

        // 모드 전환
        btn = e.target.closest('[data-mode]');
        if (btn) {
          setMode(btn.getAttribute('data-mode'));
          return;
        }

        // 슬라이드 이동
        btn = e.target.closest('[data-jump-slide]');
        if (btn) {
          goToSlide(parseInt(btn.getAttribute('data-jump-slide'), 10), true);
          return;
        }

        // 이전/다음 장
        btn = e.target.closest('[data-nav-step]');
        if (btn) {
          var step = parseInt(btn.getAttribute('data-nav-step'), 10);
          goToSlide(window.APP_STATE.currentSlideId + step, true);
          return;
        }

        // 누적 점검 초기화 후 다시 풀기
        btn = e.target.closest('[data-reset-challenge]');
        if (btn) {
          resetChallenge27();
          return;
        }

        // 수업 모드 정답 보기/숨기기
        btn = e.target.closest('[data-toggle-reveal]');
        if (btn) {
          var rId = btn.getAttribute('data-toggle-reveal');
          window.APP_STATE.revealedTasks[rId] = !window.APP_STATE.revealedTasks[rId];
          renderCurrentSlide();
          return;
        }

        // 해설 보기/숨기기
        btn = e.target.closest('[data-show-explain]');
        if (btn) {
          var eId = btn.getAttribute('data-show-explain');
          var eKind = btn.getAttribute('data-explain-kind');
          var mapName = eKind === 'choice' ? 'choices' : eKind;
          if (window.APP_STATE.student[mapName] && window.APP_STATE.student[mapName][eId]) {
            window.APP_STATE.student[mapName][eId].showExplain = !window.APP_STATE.student[mapName][eId].showExplain;
            renderCurrentSlide();
          }
          return;
        }

        // 선택형 클릭 -> 즉시 채점
        btn = e.target.closest('[data-choice-task]');
        if (btn) {
          var cTaskId = btn.getAttribute('data-choice-task');
          var cIdx = parseInt(btn.getAttribute('data-choice-index'), 10);
          var cTask = findTaskById(cTaskId);
          if (!cTask) return;
          var cState = ensureChoiceState(cTask);
          cState.selectedIndex = cIdx;
          cState.checked = cIdx === cTask.answerIndex ? 'correct' : 'wrong';
          if (cState.checked === 'correct') cState.showExplain = false;
          if (cTask.isChallenge27) {
            window.APP_STATE.student.challenge27[cTask.id] = {
              selectedIndex: cIdx,
              isCorrect: cIdx === cTask.answerIndex
            };
          }
          renderCurrentSlide();
          return;
        }

        // 칩 선택 (탭 / Enter / Space)
        btn = e.target.closest('[data-chip-kind]');
        if (btn) {
          var kind = btn.getAttribute('data-chip-kind');
          var tId = btn.getAttribute('data-task-id');
          var val = btn.getAttribute('data-chip-value');
          var lbl = btn.getAttribute('data-chip-label');
          var cur = window.APP_STATE.selectedChip;
          if (cur && cur.taskId === tId && cur.value === val && cur.kind === kind) {
            window.APP_STATE.selectedChip = null;
          } else {
            window.APP_STATE.selectedChip = { taskId: tId, kind: kind, value: val, label: lbl };
          }
          renderCurrentSlide();
          return;
        }

        // 분류 버킷/슬롯 탭 배치 또는 제거
        btn = e.target.closest('[data-drop-click]');
        if (btn) {
          var dType = btn.getAttribute('data-drop-click');
          var dTaskId = btn.getAttribute('data-task-id');
          var dTargetId = btn.getAttribute('data-target-id');
          var sel = window.APP_STATE.selectedChip;
          if (sel && sel.kind === 'classify' && sel.taskId === dTaskId) {
            placeChipIntoTarget(dTaskId, 'classify', sel.value, dType, btn);
          } else if (dType === 'slot') {
            var slTask = findTaskById(dTaskId);
            if (slTask) {
              var slSt = ensureClassifyState(slTask);
              if (slSt.placements[dTargetId]) {
                delete slSt.placements[dTargetId];
                slSt.checked = null;
                renderCurrentSlide();
              }
            }
          }
          return;
        }

        // 버킷에 들어간 칩 빼기
        btn = e.target.closest('[data-remove-chip]');
        if (btn) {
          var rmTaskId = btn.getAttribute('data-remove-chip');
          var rmItemId = btn.getAttribute('data-item-id');
          var rmTask = findTaskById(rmTaskId);
          if (rmTask) {
            var rmSt = ensureClassifyState(rmTask);
            delete rmSt.placements[rmItemId];
            rmSt.checked = null;
            renderCurrentSlide();
          }
          return;
        }

        // 분류 채점/초기화
        btn = e.target.closest('[data-grade-classify]');
        if (btn) {
          handleGradeClassify(btn.getAttribute('data-grade-classify'), false);
          return;
        }
        btn = e.target.closest('[data-reset-classify]');
        if (btn) {
          var rcId = btn.getAttribute('data-reset-classify');
          window.APP_STATE.student.classify[rcId] = { placements: {}, checked: null, showExplain: false };
          window.APP_STATE.selectedChip = null;
          renderCurrentSlide();
          return;
        }

        // 계산 단계 세그먼트 & 채점
        btn = e.target.closest('[data-calc-seg]');
        if (btn) {
          var csTaskId = btn.getAttribute('data-calc-seg');
          var csTask = findTaskById(csTaskId);
          if (csTask) {
            var csSt = ensureCalcState(csTask);
            csSt.values[btn.getAttribute('data-field-key')] = btn.getAttribute('data-seg-val');
            csSt.checked = null;
            renderCurrentSlide();
          }
          return;
        }
        btn = e.target.closest('[data-grade-calc]');
        if (btn) {
          handleGradeCalc(btn.getAttribute('data-grade-calc'));
          return;
        }

        // 원장 세그먼트 & 채점
        btn = e.target.closest('[data-ledger-seg]');
        if (btn) {
          var lsTaskId = btn.getAttribute('data-ledger-seg');
          var lsTask = findTaskById(lsTaskId);
          if (lsTask) {
            var lsSt = ensureLedgerState(lsTask);
            lsSt.values[btn.getAttribute('data-field-key')] = btn.getAttribute('data-seg-val');
            lsSt.checked = null;
            renderCurrentSlide();
          }
          return;
        }
        btn = e.target.closest('[data-grade-ledger]');
        if (btn) {
          handleGradeLedger(btn.getAttribute('data-grade-ledger'));
          return;
        }

        // 분개 계정 칸 클릭 시 선택된 칩 넣기
        var jInput = e.target.closest('[data-journal-input][data-part="account"]');
        if (jInput) {
          var selJ = window.APP_STATE.selectedChip;
          var jTId = jInput.getAttribute('data-journal-input');
          if (selJ && selJ.kind === 'journal' && selJ.taskId === jTId) {
            placeChipIntoTarget(jTId, 'journal', selJ.value, 'journal-acc', jInput);
            return;
          }
        }

        // 분개 계정 지우기
        btn = e.target.closest('[data-clear-journal]');
        if (btn) {
          var cjId = btn.getAttribute('data-clear-journal');
          var cjTask = findTaskById(cjId);
          if (cjTask) {
            var cjSt = ensureJournalState(cjTask);
            var side = btn.getAttribute('data-side');
            var row = parseInt(btn.getAttribute('data-row'), 10);
            if (cjSt[side] && cjSt[side][row]) {
              cjSt[side][row].account = '';
              cjSt.checked = null;
              renderCurrentSlide();
            }
          }
          return;
        }

        // 분개 채점/지우기
        btn = e.target.closest('[data-grade-journal]');
        if (btn) {
          handleGradeJournal(btn.getAttribute('data-grade-journal'));
          return;
        }
        btn = e.target.closest('[data-reset-journal]');
        if (btn) {
          var rjId = btn.getAttribute('data-reset-journal');
          delete window.APP_STATE.student.journal[rjId];
          window.APP_STATE.selectedChip = null;
          renderCurrentSlide();
          return;
        }
      });

      // 텍스트/숫자 입력 동기화
      document.addEventListener('input', function (e) {
        var el = e.target;
        if (el.hasAttribute('data-journal-input')) {
          var jId = el.getAttribute('data-journal-input');
          var task = findTaskById(jId);
          if (!task) return;
          var st = ensureJournalState(task);
          var side = el.getAttribute('data-side');
          var row = parseInt(el.getAttribute('data-row'), 10);
          var part = el.getAttribute('data-part');
          if (st[side] && st[side][row]) {
            st[side][row][part] = el.value;
          }
        } else if (el.hasAttribute('data-calc-input')) {
          var cId = el.getAttribute('data-calc-input');
          var cTask = findTaskById(cId);
          if (!cTask) return;
          var cSt = ensureCalcState(cTask);
          cSt.values[el.getAttribute('data-field-key')] = el.value;
        } else if (el.hasAttribute('data-ledger-input')) {
          var lId = el.getAttribute('data-ledger-input');
          var lTask = findTaskById(lId);
          if (!lTask) return;
          var lSt = ensureLedgerState(lTask);
          lSt.values[el.getAttribute('data-field-key')] = el.value;
        }
      });

      // Enter 키 즉시 채점
      document.addEventListener('keydown', function (e) {
        if (e.key !== 'Enter') return;
        var el = e.target;
        if (el.hasAttribute('data-journal-input')) {
          e.preventDefault();
          handleGradeJournal(el.getAttribute('data-journal-input'));
        } else if (el.hasAttribute('data-calc-input')) {
          e.preventDefault();
          handleGradeCalc(el.getAttribute('data-calc-input'));
        } else if (el.hasAttribute('data-ledger-input')) {
          e.preventDefault();
          handleGradeLedger(el.getAttribute('data-ledger-input'));
        }
      });

      // Pointer Events 드래그 (터치에서는 .chip-drag-handle에서만 드래그 시작해 페이지 세로 스크롤 보장)
      document.addEventListener('pointerdown', function (e) {
        var chip = e.target.closest('[data-chip-kind]');
        if (!chip) return;
        var isHandle = !!e.target.closest('.chip-drag-handle');
        if (e.pointerType !== 'mouse' && !isHandle) return;
        if (e.pointerType === 'mouse' && e.button !== 0) return;

        window.APP_STATE.drag = {
          pointerId: e.pointerId,
          startX: e.clientX,
          startY: e.clientY,
          active: false,
          taskId: chip.getAttribute('data-task-id'),
          kind: chip.getAttribute('data-chip-kind'),
          value: chip.getAttribute('data-chip-value'),
          label: chip.getAttribute('data-chip-label'),
          ghostEl: null
        };
      });

      document.addEventListener('pointermove', function (e) {
        var d = window.APP_STATE.drag;
        if (!d || d.pointerId !== e.pointerId) return;
        var dx = e.clientX - d.startX;
        var dy = e.clientY - d.startY;
        if (!d.active) {
          if (Math.hypot(dx, dy) < 7) return;
          d.active = true;
          var ghost = document.createElement('div');
          ghost.className = 'drag-ghost';
          ghost.textContent = d.label;
          document.body.appendChild(ghost);
          d.ghostEl = ghost;
        }
        if (d.ghostEl) {
          d.ghostEl.style.left = e.clientX + 'px';
          d.ghostEl.style.top = e.clientY + 'px';
        }
        var overs = document.querySelectorAll('.is-drag-over');
        for (var i = 0; i < overs.length; i++) overs[i].classList.remove('is-drag-over');
        var target = findDropTargetAt(e.clientX, e.clientY, d);
        if (target) target.classList.add('is-drag-over');
      });

      document.addEventListener('pointerup', function (e) {
        var d = window.APP_STATE.drag;
        if (!d || d.pointerId !== e.pointerId) return;
        if (d.active) {
          var target = findDropTargetAt(e.clientX, e.clientY, d);
          var taskId = d.taskId;
          var kind = d.kind;
          var value = d.value;
          cleanupDrag();
          if (target) {
            placeChipIntoTarget(taskId, kind, value, target.getAttribute('data-drop-target'), target);
          }
        } else {
          cleanupDrag();
        }
      });

      document.addEventListener('pointercancel', function () {
        cleanupDrag();
      });
    }

    /* =========================
       데이터 무결성 검사 (PART 5에서 호출)
       ========================= */
    function validateSlidesData() {
      var errors = [];
      var seenIds = {};
      if (window.SLIDES.length !== window.APP_CONFIG.totalSlides) {
        errors.push('슬라이드 수 오류: ' + window.SLIDES.length + '장 (기대값 ' + window.APP_CONFIG.totalSlides + '장)');
      }
      for (var i = 0; i < window.SLIDES.length; i++) {
        var sl = window.SLIDES[i];
        var expectedId = i + 1;
        if (sl.id !== expectedId) {
          errors.push('장 번호 불일치: 인덱스 ' + i + '의 id=' + sl.id + ' (기대값 ' + expectedId + ')');
        }
        if (seenIds[sl.id]) {
          errors.push('중복 장 번호: ' + sl.id);
        }
        seenIds[sl.id] = true;

        var tasks = sl.tasks || [];
        for (var j = 0; j < tasks.length; j++) {
          var t = tasks[j];
          if (t.type === 'journal' && t.answer) {
            var dSum = (t.answer.debit || []).reduce(function (s, x) { return s + x.amount; }, 0);
            var cSum = (t.answer.credit || []).reduce(function (s, x) { return s + x.amount; }, 0);
            if (dSum <= 0 || dSum !== cSum) {
              errors.push(sl.id + '장 분개(' + t.id + ') 대차 불일치: 차변 ' + dSum + ', 대변 ' + cSum);
            }
          }
          if (t.type === 'choice') {
            if (!t.options || t.answerIndex < 0 || t.answerIndex >= t.options.length) {
              errors.push(sl.id + '장 선택형(' + t.id + ') 정답 인덱스 오류');
            }
          }
        }
      }
      if (errors.length > 0 && window.console && console.warn) {
        console.warn('[데이터 무결성 점검 경고]', errors);
      }
      return errors;
    }

    function initApp() {
      validateSlidesData();
      bindGlobalEvents();
      renderAll();
    }
