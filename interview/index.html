<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>서울관광고 면접 꿀팁 · 모의면접</title>
<style>
:root{--gold:#f4b23c;--yellow:#ffd86d;--brown:#5b3825;--cream:#fff8e8;--ink:#2e241f;--line:#ead9bd;--ok:#2f7d4a}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",Segoe UI,sans-serif;background:#fffaf2;color:var(--ink)}
button,input,textarea{font:inherit}button{cursor:pointer}.wrap{max-width:960px;margin:auto;padding:14px 14px 70px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px}.home{color:var(--brown);text-decoration:none;font-weight:800}.pill{background:#fff0c4;border:1px solid #efcf7e;border-radius:999px;padding:8px 12px;font-size:13px;font-weight:800;color:#80501f}
.hero{background:linear-gradient(135deg,#fff2bd,#ffd76a);border:1px solid #efc662;border-radius:26px;padding:23px;box-shadow:0 10px 25px rgba(91,56,37,.08)}.hero h1{margin:0 0 8px;color:var(--brown);font-size:clamp(26px,6vw,42px)}.hero p{margin:0;line-height:1.65}.formula{margin-top:13px;background:#fff9e9;border-radius:15px;padding:12px 14px;font-weight:900;color:var(--brown)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.btn{border:0;border-radius:13px;min-height:46px;padding:11px 14px;font-weight:800;background:var(--brown);color:#fff}.btn.alt{background:#fff;border:1px solid var(--line);color:var(--brown)}.status{font-size:13px;color:#6d625c;margin:4px 2px 14px}
.q{background:white;border:1px solid var(--line);border-radius:20px;margin:12px 0;overflow:hidden;box-shadow:0 4px 14px rgba(60,40,20,.04)}summary{list-style:none;padding:18px;display:flex;gap:12px;align-items:flex-start;cursor:pointer}summary::-webkit-details-marker{display:none}.num{flex:none;width:38px;height:38px;border-radius:13px;background:#fff0bd;color:var(--brown);display:grid;place-items:center;font-weight:900}.qtitle{font-weight:900;line-height:1.45}.sub{font-size:13px;color:#776b64;margin-top:5px}.body{padding:0 18px 20px;border-top:1px solid #f1e7d7}.meaning{background:var(--cream);padding:13px;border-radius:14px;line-height:1.55;margin:16px 0}.keys{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid #e0c993;background:#fff;border-radius:999px;padding:9px 12px;color:#65451e;min-height:42px}.chip.on{background:#ffe29a;border-color:#c79528;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-top:14px}.field label{font-size:13px;font-weight:900;color:#644833}.field textarea{width:100%;min-height:105px;border:1px solid #ddcdb7;border-radius:13px;padding:11px;margin-top:5px;resize:vertical;background:#fff}.answer{margin-top:12px}.answer textarea{min-height:150px}.minirow{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px}.mini{border:1px solid #d9c6ac;background:#fff;border-radius:11px;padding:9px 11px;font-weight:750;color:#644833}.checks{margin-top:12px;display:grid;gap:8px}.checks label{display:flex;gap:9px;align-items:flex-start;background:#fffaf0;border-radius:11px;padding:9px}.timer{margin-top:15px;padding:14px;border:1px dashed #d5ad55;border-radius:15px;background:#fff7df}.clock{font-size:34px;font-weight:900;color:var(--brown);letter-spacing:.03em}.timer .minirow{margin-top:8px}.danger{color:#a3372d}.foot{font-size:13px;color:#7a6d65;text-align:center;margin-top:22px;line-height:1.6}
@media(max-width:720px){.grid{grid-template-columns:1fr}.hero{padding:19px}.body{padding:0 14px 18px}summary{padding:15px}.toolbar .btn{flex:1 1 45%}}
</style>
</head>
<body><main class="wrap">
<div class="top"><a class="home" href="../">← 학생용 웹앱</a><span class="pill">2027학년도 준비</span></div>
<section class="hero"><h1>🎤 서울관광고 면접 꿀팁</h1><p>완벽한 문장을 외우기보다 <strong>내 이야기</strong>를 준비하세요. 질문의 뜻을 이해하고, 실제 경험을 떠올린 뒤, 입학 후 계획으로 연결하면 됩니다.</p><div class="formula">답변 공식 · 생각 → 경험 → 계획</div></section>
<div class="toolbar"><button class="btn" id="copyAll">전체 답변 복사</button><button class="btn alt" id="exportTxt">텍스트 저장</button><button class="btn alt" id="openAll">질문 모두 펼치기</button><button class="btn alt danger" id="resetAll">전체 초기화</button></div>
<div class="status" id="saveStatus">입력 내용은 이 브라우저에 자동 저장됩니다.</div>
<section id="questions"></section>
<div class="foot">면접 답변은 3~5문장 정도로 또렷하고 천천히 말해보세요.<br>질문이 끝난 뒤 잠깐 생각하고 답해도 괜찮습니다.</div>
</main>
<script>
const Q=[
{q:'본교 지원동기, 본인 성격의 장·단점을 포함한 자기소개를 해주세요. (1분 이내)',m:'내가 어떤 학생인지, 왜 서울관광고에 오고 싶은지, 자신의 장점과 보완점을 알고 있는지 확인하는 질문입니다.',k:['성실함','책임감','친절함','도전','학교행사','발표경험','관심학과','단점 보완'],h:'나는 어떤 학생인지 → 장점과 실제 경험 → 보완하고 있는 점 → 서울관광고 지원 이유',t:60},
{q:'지원학과 수업 중 가장 기대되는 과목은 무엇이며, 그 이유는 무엇인가요?',m:'지원 학과를 실제로 알아보고 왔는지 확인하는 질문입니다.',k:['전공체험','입학설명회','실습','카페운영','마케팅','서비스','관심분야','배우고 싶은 것'],h:'기대되는 과목·활동 → 관심을 갖게 된 이유 → 입학 후 해보고 싶은 것',t:90},
{q:'장래 희망 직업은 무엇이며, 그 직업을 선택한 이유는 무엇인가요?',m:'직업을 이미 확정했는지가 아니라 앞으로 무엇을 하고 싶은지 생각해 본 학생인지 확인하는 질문입니다.',k:['호텔','항공','카페','외식','관광','서비스','마케팅','진로탐색'],h:'현재 관심 직업·분야 → 관심을 갖게 된 계기 → 서울관광고에서 더 알아보고 싶은 것',t:90},
{q:'중학교에서 기억에 남는 경험은 무엇이며, 그 활동에서 맡았던 역할은 무엇인가요?',m:'중학교 생활에서 어떤 태도로 참여했던 학생인지 알고 싶은 질문입니다. 큰 상이나 특별한 활동이 없어도 됩니다.',k:['학교축제','체육대회','동아리','조별활동','학급행사','봉사활동','친구도움','프로젝트'],h:'어떤 활동이었는지 → 내 역할 → 내가 한 행동 → 무엇을 배웠는지',t:90},
{q:'친구와 갈등이 생겼던 경험을 소개해 주고, 어떻게 해결했는지 얘기해 주세요.',m:'갈등 자체보다 의견이 다를 때 어떻게 해결하려고 행동했는지를 보는 질문입니다.',k:['조별활동','역할분담','오해','의견차이','경청','대화','양보','해결'],h:'무슨 문제가 있었는지 → 상대 이야기를 들은 과정 → 내가 한 해결 행동 → 결과와 배운 점',t:90},
{q:'새로운 환경에 적응하는 본인만의 방법이 있나요?',m:'새로운 고등학교에서도 친구들과 잘 지내고 학교생활에 적응할 수 있을지 확인하는 질문입니다.',k:['새학년','새반','동아리','새친구','조별활동','먼저인사','적극참여','관찰'],h:'처음 어떻게 하는 편인지 → 실제 적응 경험 → 고등학교에서도 어떻게 할 것인지',t:90},
{q:'힘든 일이 생겼을 때 주로 어떻게 극복하는 편인가요?',m:'어려움이 생겼을 때 포기하는지, 해결하려고 노력하는지 확인하는 질문입니다.',k:['공부','시험','실기','친구관계','실패','재도전','도움요청','작은목표'],h:'어떤 어려움이 있었는지 → 내가 한 행동 → 도움을 받은 방법 → 결과 또는 배운 점',t:90},
{q:'마지막으로 하고 싶은 말이 있나요?',m:'면접관에게 마지막으로 기억해 주었으면 하는 마음을 전하는 시간입니다. 새 이야기를 길게 시작하기보다 지원 의지와 입학 후 모습을 짧게 정리하세요.',k:['지원의지','입학후활동','성실함','적극성','성장','전공','감사','다짐'],h:'꼭 전하고 싶은 한 가지 → 입학 후 계획 → 감사 인사',t:90}
];
const KEY='sths-interview-v1';let data={};try{data=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const esc=s=>(s||'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));document.querySelector('#saveStatus').textContent='✓ 자동 저장됨'}catch(e){document.querySelector('#saveStatus').textContent='이 브라우저에서는 자동 저장이 제한될 수 있습니다.'}}
function d(i){return data[i]||(data[i]={think:'',exp:'',plan:'',answer:'',chips:[],checks:[false,false,false]})}
function compose(i){let x=d(i),parts=[];if(x.think.trim())parts.push(x.think.trim());if(x.exp.trim())parts.push(x.exp.trim());if(x.plan.trim())parts.push(x.plan.trim());x.answer=parts.join(' ');save();renderAnswer(i)}
function renderAnswer(i){const el=document.querySelector('#ans'+i);if(el)el.value=d(i).answer||''}
function card(q,i){const x=d(i);return `<details class="q"><summary><div class="num">Q${i+1}</div><div><div class="qtitle">${q.q}</div><div class="sub">답변 구조 · ${q.h}</div></div></summary><div class="body"><div class="meaning"><strong>이 질문의 뜻</strong><br>${q.m}</div><strong>경험 키워드</strong><div class="keys">${q.k.map(k=>`<button class="chip ${x.chips.includes(k)?'on':''}" data-i="${i}" data-chip="${k}">${k}</button>`).join('')}</div><div class="grid"><div class="field"><label>① 생각</label><textarea data-i="${i}" data-f="think" placeholder="이 질문에 대한 내 생각이나 결론">${esc(x.think)}</textarea></div><div class="field"><label>② 경험</label><textarea data-i="${i}" data-f="exp" placeholder="내가 실제로 했던 경험과 행동">${esc(x.exp)}</textarea></div><div class="field"><label>③ 계획</label><textarea data-i="${i}" data-f="plan" placeholder="서울관광고에서 해보고 싶은 것">${esc(x.plan)}</textarea></div></div><div class="minirow"><button class="mini" data-compose="${i}">생각·경험·계획으로 답변 구성</button><button class="mini danger" data-reset="${i}">이 질문 초기화</button></div><div class="field answer"><label>나의 최종 답변 · 직접 고쳐도 됩니다</label><textarea id="ans${i}" data-i="${i}" data-f="answer" placeholder="여기에 나만의 답변을 완성해 보세요.">${esc(x.answer)}</textarea></div><div class="checks"><label><input type="checkbox" data-check="0" data-i="${i}" ${x.checks[0]?'checked':''}> 질문에 맞는 답을 했나요?</label><label><input type="checkbox" data-check="1" data-i="${i}" ${x.checks[1]?'checked':''}> 실제 경험이나 행동이 들어갔나요?</label><label><input type="checkbox" data-check="2" data-i="${i}" ${x.checks[2]?'checked':''}> 입학 후 계획이나 배운 점으로 마무리했나요?</label></div><div class="timer"><div>모의면접 타이머</div><div class="clock" id="clock${i}">${String(Math.floor(q.t/60)).padStart(2,'0')}:${String(q.t%60).padStart(2,'0')}</div><div class="minirow"><button class="mini" data-timer="start" data-i="${i}">시작</button><button class="mini" data-timer="pause" data-i="${i}">일시정지</button><button class="mini" data-timer="reset" data-i="${i}">초기화</button></div></div></div></details>`}
document.querySelector('#questions').innerHTML=Q.map(card).join('');
document.addEventListener('input',e=>{if(e.target.matches('textarea[data-i]')){let i=e.target.dataset.i,f=e.target.dataset.f;d(i)[f]=e.target.value;save()}});
document.addEventListener('change',e=>{if(e.target.matches('input[data-check]')){let i=e.target.dataset.i,c=+e.target.dataset.check;d(i).checks[c]=e.target.checked;save()}});
document.addEventListener('click',e=>{let b=e.target;if(b.matches('.chip')){let i=b.dataset.i,k=b.dataset.chip,a=d(i).chips;a.includes(k)?a.splice(a.indexOf(k),1):a.push(k);b.classList.toggle('on');save()}if(b.dataset.compose!==undefined)compose(b.dataset.compose);if(b.dataset.reset!==undefined){let i=b.dataset.reset;if(confirm('이 질문의 작성 내용을 초기화할까요?')){delete data[i];save();location.reload()}}if(b.dataset.timer){timerAct(+b.dataset.i,b.dataset.timer)}});
let timers={};function draw(i,s){let el=document.querySelector('#clock'+i);el.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function timerAct(i,a){let t=timers[i]||(timers[i]={left:Q[i].t,id:null});if(a==='start'&&!t.id)t.id=setInterval(()=>{t.left--;draw(i,t.left);if(t.left<=0){clearInterval(t.id);t.id=null}},1000);if(a==='pause'&&t.id){clearInterval(t.id);t.id=null}if(a==='reset'){if(t.id)clearInterval(t.id);t.left=Q[i].t;t.id=null;draw(i,t.left)}}
document.querySelector('#openAll').onclick=()=>document.querySelectorAll('details.q').forEach(x=>x.open=true);
document.querySelector('#resetAll').onclick=()=>{if(confirm('8개 질문의 모든 작성 내용을 초기화할까요?')){data={};save();location.reload()}};
function allText(){return Q.map((q,i)=>`Q${i+1}. ${q.q}\n${d(i).answer||'(작성 전)'}`).join('\n\n')}
document.querySelector('#copyAll').onclick=async()=>{let txt=allText();try{await navigator.clipboard.writeText(txt);alert('전체 답변을 복사했습니다.')}catch(e){prompt('아래 내용을 복사하세요.',txt)}};
document.querySelector('#exportTxt').onclick=()=>{let blob=new Blob([allText()],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='서울관광고_면접답변.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
</script></body></html>
