<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>viewport check</title>
<style>
 html,body{margin:0;background:#cfcfcf;font:12px/1.4 sans-serif}
 .mob{width:390px;height:844px;overflow:hidden;background:#fff;box-shadow:0 0 0 1px #888;margin:12px}
 .mob iframe{width:390px;height:844px;border:0;display:block}
 .cap{margin:12px 12px 0;font-weight:700;color:#222}
</style></head>
<body>
<div class="cap">mobile 390 — case-study (CASE 1 갤러리)</div>
<div class="mob"><iframe id="m1" src="case-study.html" title="mobile case"></iframe></div>
<div class="cap">mobile 390 — module-1 (실무 1 갤러리)</div>
<div class="mob"><iframe id="m2" src="module-1.html" title="mobile module1"></iframe></div>
<script>
function go(id, sel){const f=document.getElementById(id);
  f.addEventListener('load',()=>{try{const el=f.contentDocument.querySelector(sel); if(el) el.scrollIntoView({block:'start'});}catch(e){}});}
go('m1','.casepanel .shots-head');
go('m2','#m1-1 .shots-head');
</script>
</body></html>
