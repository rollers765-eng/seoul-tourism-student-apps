<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>viewport check</title>
<style>
 html,body{margin:0;background:#cfcfcf;font:12px/1.4 sans-serif}
 .mob{width:390px;height:844px;overflow:hidden;background:#fff;box-shadow:0 0 0 1px #888;margin:8px 12px}
 .mob iframe{width:390px;height:844px;border:0;display:block}
 .cap{margin:8px 12px 0;font-weight:700;color:#222}
</style></head>
<body>
<div class="cap">mobile 390 — module-2 실무 5</div>
<div class="mob"><iframe id="a" src="module-2.html" title="m2"></iframe></div>
<div class="cap">mobile 390 — module-3 실무 9</div>
<div class="mob"><iframe id="b" src="module-3.html" title="m3"></iframe></div>
<div class="cap">mobile 390 — module-4 실무 11</div>
<div class="mob"><iframe id="c" src="module-4.html" title="m4"></iframe></div>
<script>
function go(id, sel){const f=document.getElementById(id);
  f.addEventListener('load',()=>{try{const el=f.contentDocument.querySelector(sel); if(el) el.scrollIntoView({block:'start'});}catch(e){}});}
go('a','#m2-1 .shots-head');
go('b','#m3-3 .shots-head');
go('c','#m4-2 .ytbox');
</script>
</body></html>
